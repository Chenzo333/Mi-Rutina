<style>
:root{
  --gold:#C4922A;--gold-dim:rgba(196,146,42,0.13);--gold-border:rgba(196,146,42,0.35);
  --bg:#0C0C0C;--surface:#141414;--surface2:#1C1C1C;--surface3:#242424;--surface4:#2C2C2C;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--border3:rgba(255,255,255,0.2);
  --text:#F0EAD8;--text2:#9A9488;--text3:#5A5650;--text4:#3A3630;
  --red:#C44A4A;--red-dim:rgba(196,74,74,0.12);
  --radius:8px;--radius-lg:12px;
}
body.light{
  --bg:#F4F2ED;--surface:#FFFFFF;--surface2:#F0EDE6;--surface3:#E4E0D8;--surface4:#D8D4CC;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.14);--border3:rgba(0,0,0,0.22);
  --text:#1A1714;--text2:#5A5248;--text3:#9A9488;--text4:#C4C0B8;
  --red-dim:rgba(196,74,74,0.1);
}
.theme-btn{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--radius);cursor:pointer;color:var(--text3);font-size:16px;transition:all .12s;border:none;background:none;width:100%;text-align:left;font-family:'DM Sans',sans-serif;}
.theme-btn:hover{background:var(--surface2);color:var(--text2);}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;min-height:100vh;line-height:1.5;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:2px;}
body::before{content:'';position:fixed;inset:0;background-image:repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(196,146,42,0.02) 39px,rgba(196,146,42,0.02) 40px),repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(196,146,42,0.02) 39px,rgba(196,146,42,0.02) 40px);pointer-events:none;z-index:-1;}

.shell{display:flex;height:100vh;overflow:hidden;}
.sidebar{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column;}

.brand{padding:22px 20px 18px;border-bottom:1px solid var(--border);}
.brand-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;color:var(--text);line-height:1;}
.brand-title span{color:var(--gold);}
.brand-accent{height:2px;background:linear-gradient(to right,var(--gold),transparent);width:55px;margin:5px 0 0;}
.brand-sub{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;margin-top:6px;}

.nav{padding:12px 10px;flex:1;overflow-y:auto;}
.nav-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2.5px;color:var(--text3);text-transform:uppercase;padding:8px 10px 5px;}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius);cursor:pointer;color:var(--text2);font-size:13px;transition:all .12s;margin-bottom:2px;border:1px solid transparent;}
.nav-item:hover{background:var(--surface2);color:var(--text);}
.nav-item.active{background:var(--gold-dim);color:var(--text);border-color:var(--gold-border);font-weight:500;}
.nav-dot{width:7px;height:7px;border-radius:2px;flex-shrink:0;}
.task-badge{margin-left:auto;background:var(--surface3);color:var(--text3);font-size:10px;font-family:'DM Mono',monospace;padding:1px 6px;border-radius:10px;}

.nav-footer{padding:10px;border-top:1px solid var(--border);}
.footer-btn{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--radius);cursor:pointer;color:var(--text3);font-size:12px;transition:all .12s;border:none;background:none;width:100%;text-align:left;font-family:'DM Sans',sans-serif;}
.footer-btn:hover{background:var(--surface2);color:var(--text2);}

.page-header{padding:22px 30px 16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;flex-shrink:0;}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:3px;color:var(--text);line-height:1;}
.page-sub{font-size:13px;color:var(--text2);margin-top:4px;}
.header-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

.btn{padding:7px 14px;border-radius:var(--radius);font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);transition:all .12s;line-height:1.4;}
.btn:hover{background:var(--surface3);color:var(--text);}
.btn-primary{background:var(--gold);color:#0C0C0C;border-color:var(--gold);font-weight:600;}
.btn-primary:hover{background:#D4A030;border-color:#D4A030;}
.btn-sm{padding:5px 10px;font-size:12px;}

.page-content{padding:22px 30px;flex:1;}

/* WEEK */
.week-grid{display:grid;gap:10px;grid-template-columns:repeat(7,1fr);}
.week-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;transition:border-color .15s;}
.week-card:hover{border-color:var(--border2);}
.week-card-head{padding:10px 13px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.wc-day{font-size:12px;font-weight:600;color:var(--text);}
.wc-count{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;}
.week-card-body{padding:8px 11px;}
.mini-block{display:flex;align-items:center;gap:5px;padding:2px 0;}
.mini-dot{width:5px;height:5px;border-radius:1px;flex-shrink:0;}
.mini-time{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;min-width:30px;}
.mini-title{font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini-more{font-size:10px;color:var(--text3);padding:3px 0 1px;}

/* DAY LAYOUT */
.day-layout{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start;}.day-layout>div:last-child{align-self:start;position:sticky;top:16px;}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;}
.panel-hd{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.panel-title{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);}
.panel-body{padding:10px;}

.timed-task-row{display:flex;align-items:center;gap:12px;padding:8px 13px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface2);cursor:grab;transition:all .15s;}
.timed-task-row:active{cursor:grabbing;}
.timed-task-row:hover .tt-del{opacity:1!important;}
.timed-task-row.dragging{opacity:.3;}
.timed-task-row.drag-target{border:1px dashed var(--gold);background:var(--gold-dim);}

/* TIMELINE */
.timeline{display:flex;flex-direction:column;gap:4px;}
.gap-btn{display:flex;align-items:center;gap:8px;padding:3px 6px;cursor:pointer;transition:all .15s;border-radius:var(--radius);margin:2px 0;}
.gap-btn:hover{background:var(--surface2);}
.gap-line{flex:1;height:1px;background:var(--border);}
.gap-plus{font-size:13px;color:var(--text3);width:20px;height:20px;border-radius:50%;border:1px dashed var(--border2);display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;}
.gap-btn:hover .gap-plus{border-color:var(--gold);color:var(--gold);}
.gap-hours{display:none;flex-direction:column;gap:3px;padding:4px 0;}
.gap-hours.open{display:flex;}
.gap-hour-slot{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:var(--radius);border:1px dashed var(--border);cursor:pointer;transition:all .15s;}
.gap-hour-slot:hover,.gap-hour-slot.drag-target{border-color:var(--gold);background:var(--gold-dim);}
.gap-hour-time{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);min-width:38px;}
.gap-hour-hint{font-size:11px;color:var(--text3);}
.gap-hour-slot.drag-target .gap-hour-hint{color:var(--gold);}

/* BLOCK */
.block-wrap{position:relative;}
.block-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius);border:1px solid var(--border);border-left:3px solid;transition:all .15s;position:relative;background:var(--surface2);padding-right:80px;}
.block-item.editable-block:hover{border-color:var(--border2);}
.block-item.drag-target{border-style:dashed!important;border-color:var(--gold)!important;}

.block-time-col{flex-shrink:0;width:auto;align-self:flex-start;padding-top:2px;}
.btime{font-family:'Bebas Neue',sans-serif;font-size:14px;font-weight:400;color:var(--text);letter-spacing:1px;}
.btime-arrow{font-size:10px;color:var(--text3);line-height:1;vertical-align:middle;margin:0 1px;}
.btime.editable{cursor:pointer;border-bottom:1px dashed var(--text4);transition:border-color .1s;}
.btime.editable:hover{border-color:var(--text3);}
.btime-input{font-family:'DM Mono',monospace;font-size:12px;color:var(--text);background:var(--surface3);border:1px solid var(--gold-border);border-radius:4px;padding:1px 4px;width:62px;outline:none;}

.block-body{flex:1;min-width:0;align-self:flex-start;}
.bname{font-size:14px;font-weight:600;color:var(--text);line-height:1.3;}
.bname.editable{cursor:pointer;border-bottom:1px dashed var(--text4);display:inline-block;}
.bname.editable:hover{border-color:var(--text3);}
.bname-input{font-size:14px;font-weight:500;color:var(--text);background:var(--surface3);border:1px solid var(--gold-border);border-radius:4px;padding:2px 6px;width:100%;outline:none;font-family:'DM Sans',sans-serif;}
.bdesc{font-size:12px;color:var(--text2);margin-top:3px;font-weight:300;border-radius:4px;padding:1px 3px;border:1px solid transparent;transition:all .1s;}
.bdesc.editable{cursor:text;}
.bdesc.editable:hover{background:var(--surface3);border-color:var(--border2);}
.bdesc[contenteditable="true"]{outline:none;background:var(--surface3);border-color:var(--gold-border);color:var(--text);}

.bmeta{display:flex;align-items:center;gap:5px;margin-top:7px;flex-wrap:wrap;}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-family:'DM Mono',monospace;padding:2px 8px;border-radius:10px;border:1px solid transparent;}
.tag-name{cursor:default;}
.tag-name.editable{cursor:pointer;}
.tag-del-btn{background:none;border:none;cursor:pointer;font-size:10px;line-height:1;padding:0 0 0 1px;opacity:.5;}
.tag-del-btn:hover{opacity:1;}
.tag-ghost{opacity:.3;background:var(--gold-dim)!important;}
.tag-add-btn{cursor:pointer;opacity:.45;font-size:10px;padding:2px 7px;border-radius:10px;border:1px dashed var(--border2);color:var(--text3);font-family:'DM Mono',monospace;background:none;transition:all .1s;}
.tag-add-btn:hover{opacity:1;background:var(--surface3);}
.lock-tag{font-size:10px;font-family:'DM Mono',monospace;padding:2px 8px;border-radius:10px;background:var(--surface3);color:var(--text3);}

.block-tasks{margin-top:8px;padding-top:7px;border-top:1px solid var(--border);}
.btask-row{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:12px;}
.btask-check{width:14px;height:14px;border-radius:50%;border:1px solid var(--border2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:9px;color:transparent;flex-shrink:0;transition:all .12s;}
.btask-check.done{background:var(--gold);border-color:var(--gold);color:#0C0C0C;}
.btask-lbl{flex:1;color:var(--text2);}
.btask-lbl.done{text-decoration:line-through;color:var(--text3);}
.btask-del{background:none;border:none;cursor:pointer;color:var(--text3);font-size:11px;opacity:0;transition:opacity .1s;}
.btask-row:hover .btask-del{opacity:1;}
.btask-del:hover{color:var(--red);}

.block-actions{display:flex;gap:3px;align-items:center;opacity:0;transition:opacity .15s;position:absolute;top:8px;right:8px;}
.block-item:hover .block-actions{opacity:1;}
.iBtn{width:27px;height:27px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:12px;transition:all .1s;position:relative;}
.iBtn:hover{background:var(--surface3);color:var(--text);border-color:var(--border2);}
.iBtn.lock-on{background:var(--gold-dim);color:var(--gold);border-color:var(--gold-border);}
.iBtn.del:hover{background:var(--red-dim);color:var(--red);}

/* COLOR PICKER */
.cp-popup{position:absolute;top:32px;right:0;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:12px;z-index:60;display:none;box-shadow:0 8px 28px rgba(0,0,0,.65);min-width:215px;}
.cp-popup.open{display:block;}
.cp-popup.upward{top:auto;bottom:32px;}
.cp-lbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-bottom:5px;}
.cp-swatches{display:grid;grid-template-columns:repeat(7,20px);gap:4px;margin-bottom:7px;}
.sw{width:20px;height:20px;border-radius:3px;cursor:pointer;border:2px solid transparent;transition:transform .1s;}
.sw:hover{transform:scale(1.2);}
.sw.sel{border-color:var(--text);}
.cp-row{display:flex;gap:6px;align-items:center;margin-bottom:4px;}
.cp-prev{width:20px;height:20px;border-radius:3px;border:1px solid var(--border2);flex-shrink:0;}
.cp-hex{background:var(--surface2);border:1px solid var(--border2);border-radius:5px;padding:3px 7px;color:var(--text);font-size:11px;font-family:'DM Mono',monospace;width:80px;outline:none;}
.cp-div{height:1px;background:var(--border);margin:8px 0;}

/* TAG POPUP */
.tag-popup{position:absolute;bottom:110%;left:0;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:12px;z-index:70;display:none;box-shadow:0 8px 28px rgba(0,0,0,.65);min-width:230px;}
.tag-popup.open{display:block;}
.tag-input-row{display:flex;align-items:center;gap:6px;margin-bottom:7px;}
.tag-text-inp{flex:1;background:var(--surface2);border:1px solid var(--border2);border-radius:5px;padding:5px 9px;color:var(--text);font-size:12px;outline:none;font-family:'DM Sans',sans-serif;}
.tag-csw{width:20px;height:20px;border-radius:3px;border:1px solid var(--border2);flex-shrink:0;}
.mini-pal{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:7px;}
.msw{width:16px;height:16px;border-radius:2px;cursor:pointer;border:1px solid transparent;transition:transform .1s;}
.msw:hover{transform:scale(1.2);}
.msw.sel{border-color:var(--text);}
.tag-popup-btns{display:flex;gap:6px;}

/* TASKS PANEL */
.free-drop{min-height:36px;border:1px dashed var(--border);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text3);padding:8px;margin-bottom:8px;transition:all .15s;font-family:'DM Mono',monospace;}
.free-drop.hover{border-color:var(--gold);color:var(--gold);background:var(--gold-dim);}
.task-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius);margin-bottom:4px;background:var(--surface2);border:1px solid var(--border);cursor:grab;}
.task-item:active{cursor:grabbing;opacity:.6;}
.task-item.dragging{opacity:.3;}
.task-item:hover .task-del{opacity:1;}
.grab{color:var(--text3);font-size:11px;}
.tchk{width:16px;height:16px;border-radius:50%;border:1px solid var(--border2);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent;transition:all .12s;}
.tchk.done{background:var(--gold);border-color:var(--gold);color:#0C0C0C;}
.tlbl{flex:1;font-size:13px;color:var(--text);}
.tlbl.done{text-decoration:line-through;color:var(--text3);}
.task-del{background:none;border:none;cursor:pointer;color:var(--text3);font-size:13px;opacity:0;transition:opacity .1s;padding:1px;}
.task-del:hover{color:var(--red);}
.drag-hint{font-size:10px;color:var(--text3);text-align:center;padding:5px 0 3px;font-family:'DM Mono',monospace;}

.form-input{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);padding:7px 11px;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .1s;}
.form-input:focus{border-color:var(--gold-border);}
.form-input::placeholder{color:var(--text3);}
.form-input option{background:var(--surface2);}

.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(4px);}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-lg);width:450px;max-width:100%;}
.modal-hd{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-ttl{font-size:15px;font-weight:500;color:var(--text);}
.modal-x{background:none;border:none;cursor:pointer;color:var(--text3);font-size:17px;line-height:1;}
.modal-x:hover{color:var(--text);}
.modal-body{padding:18px 20px;}
.modal-ft{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.flbl{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;letter-spacing:1px;text-transform:uppercase;margin-bottom:5px;}
.fgrp{margin-bottom:13px;}
.fgrp .form-input{width:100%;}

.legend{display:flex;gap:12px;flex-wrap:wrap;}
.leg-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2);}
.leg-dot{width:7px;height:7px;border-radius:2px;}
.empty{font-size:13px;color:var(--text3);padding:14px 0;text-align:center;}

.corner{position:fixed;width:36px;height:36px;pointer-events:none;z-index:0;}
.corner.tl{top:0;left:0;border-top:1px solid var(--gold-border);border-left:1px solid var(--gold-border);}
.corner.br{bottom:0;right:0;border-bottom:1px solid var(--gold-border);border-right:1px solid var(--gold-border);}

@media(max-width:860px){.day-layout{grid-template-columns:1fr;}.week-grid{grid-template-columns:repeat(4,1fr);}}

/* ── MOBILE ── */
@media(max-width:600px){
  .corner,.sidebar{display:none!important;}
  body{overflow:hidden;}

  .shell{flex-direction:column;height:100dvh;height:100vh;}
  .main{flex:1;overflow:hidden;display:flex;flex-direction:column;}

  /* Mobile header */
  .page-header{padding:12px 16px 10px;flex-shrink:0;}
  .page-title{font-size:22px;letter-spacing:2px;}
  .page-sub{font-size:11px;}
  .header-right{gap:6px;}
  .header-right .btn{padding:5px 10px;font-size:12px;}

  /* Scrollable content */
  .page-content{padding:12px 14px;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:80px;}

  /* Week grid */
  .week-grid{grid-template-columns:repeat(2,1fr)!important;gap:8px;}
  .week-card-head{padding:8px 10px 6px;}
  .wc-day{font-size:13px;}

  /* Day layout — single column, no side panel */
  .day-layout{grid-template-columns:1fr!important;gap:12px;}

  /* Blocks — thinner, more spacious */
  .block-item{padding:8px 10px;gap:6px;padding-right:70px;}
  .block-inner{padding:8px 10px 8px 14px;}
  .bname{font-size:14px;}
  .bdesc{font-size:12px;margin-top:1px;}
  .block-time-col{min-width:44px;max-width:72px;}
  .btime{font-size:13px;font-weight:400;color:var(--text);font-family:'Bebas Neue',sans-serif;letter-spacing:1px;}
  .block-actions{opacity:1!important;}
  .iBtn{width:30px;height:30px;font-size:13px;}
  .block-meta{margin-top:4px;}
  .cat-pill{font-size:9px;padding:1px 6px;}
  .lock-pill{font-size:9px;padding:1px 6px;}

  /* Timeline */
  .timed-task-row{padding:8px 10px;}
  .gap-btn{padding:4px 6px;}

  /* Tasks panel — full width below blocks on mobile */
  .day-layout>div:last-child .panel{margin-top:8px;}
  .task-item{padding:8px 10px;}
  .tlbl{font-size:13px;}

  /* Page content more breathing room */
  .page-content{padding:10px 10px;padding-bottom:80px;}
  .panel-body{padding:8px;}
  .panel-head{padding:10px 12px;}

  /* Week grid more compact */
  .week-card-body{padding:6px 10px;}
  .mini-block{padding:2px 0;}
  .mini-title{font-size:11px;}
  .mini-time{font-size:10px;}

  /* Modal full-screen on mobile */
  .modal-ov{padding:0;align-items:flex-end;}
  .modal{width:100%;border-radius:var(--radius-lg) var(--radius-lg) 0 0;max-height:92dvh;max-height:92vh;overflow-y:auto;}
  .modal-body{padding:16px;}
  .modal-ft{padding:12px 16px;gap:8px;}
  .modal-ft .btn{flex:1;text-align:center;padding:10px;}

  /* Day selector strip */
  .mob-day-strip{display:flex;overflow-x:auto;gap:6px;padding:10px 14px 0;flex-shrink:0;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .mob-day-strip::-webkit-scrollbar{display:none;}
  .mob-day-pill{flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);transition:all .15s;white-space:nowrap;}
  .mob-day-pill.active{background:var(--gold);color:#0C0C0C;border-color:var(--gold);}

  /* Bottom tab bar */
  .mob-tabbar{display:flex;flex-shrink:0;background:var(--surface);border-top:1px solid var(--border);padding:0;height:60px;padding-bottom:env(safe-area-inset-bottom);}
  .mob-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--text3);transition:color .15s;border:none;background:none;font-family:'DM Sans',sans-serif;}
  .mob-tab.active{color:var(--gold);}
  .mob-tab-icon{font-size:20px;line-height:1;}
  .mob-tab-label{font-size:10px;font-family:'DM Mono',monospace;letter-spacing:.5px;}

  /* More menu */
  .mob-more-menu{position:fixed;bottom:60px;right:0;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:12px 0;z-index:90;width:220px;display:none;}
  .mob-more-menu.open{display:block;}
  .mob-more-item{display:flex;align-items:center;gap:10px;padding:12px 18px;font-size:14px;color:var(--text2);cursor:pointer;border:none;background:none;width:100%;font-family:'DM Sans',sans-serif;}
  .mob-more-item:hover,.mob-more-item:active{background:var(--surface2);color:var(--text);}
}

/* Hide tab bar on desktop */
.mob-tabbar,.mob-day-strip,.mob-more-menu{display:none;}

/* ── LOGIN SCREEN ── */
#login-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;padding:40px 20px;}
#login-screen.hidden{display:none;}
.login-logo{font-family:'Bebas Neue',sans-serif;font-size:52px;letter-spacing:6px;color:var(--text);margin-bottom:8px;}
.login-logo span{color:var(--gold);}
.login-accent{height:2px;background:linear-gradient(to right,var(--gold),transparent);width:80px;margin:0 auto 32px;}
.login-sub{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:3px;color:var(--text3);text-transform:uppercase;margin-bottom:48px;}
.login-btn{display:flex;align-items:center;gap:14px;padding:14px 28px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-lg);cursor:pointer;color:var(--text);font-size:15px;font-family:'DM Sans',sans-serif;font-weight:500;transition:all .15s;min-width:240px;justify-content:center;}
.login-btn:hover{background:var(--surface2);border-color:var(--gold-border);}
.login-btn svg{width:22px;height:22px;flex-shrink:0;}
.login-user{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:20px;}
.login-user img{width:48px;height:48px;border-radius:50%;border:2px solid var(--gold-border);}
.login-user-name{font-size:14px;color:var(--text2);}
.login-loading{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);letter-spacing:2px;margin-top:20px;}

/* ── RICH TEXT EDITOR ── */
.rte-wrap{border:1px solid var(--border2);border-radius:var(--radius);overflow:hidden;}
.rte-toolbar{display:flex;gap:2px;padding:6px 8px;background:var(--surface2);border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center;}
.rte-btn{min-width:28px;height:28px;padding:0 6px;border-radius:5px;border:1px solid transparent;background:none;cursor:pointer;color:var(--text2);font-size:13px;display:flex;align-items:center;justify-content:center;transition:all .1s;}
.rte-btn:hover{background:var(--surface3);color:var(--text);}
.rte-btn.rte-active{background:var(--gold-dim);color:var(--gold);border-color:var(--gold-border);}
.rte-sep{width:1px;background:var(--border);margin:0 4px;align-self:stretch;}
.rte-color-btn{width:18px;height:18px;border-radius:3px;border:2px solid transparent;cursor:pointer;transition:transform .1s;flex-shrink:0;}
.rte-color-btn:hover{transform:scale(1.2);}
.rte-color-btn.rte-color-active{border-color:var(--text);}
.rte-color-preview{width:18px;height:4px;border-radius:2px;margin-top:2px;}
.rte-area{padding:12px;min-height:80px;max-height:300px;overflow-y:auto;outline:none;font-size:14px;color:var(--text);background:var(--surface);line-height:1.6;font-family:'DM Sans',sans-serif;}
.rte-area:empty:before{content:attr(data-placeholder);color:var(--text3);font-style:italic;}
.rte-font-select{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:3px 6px;color:var(--text2);font-size:12px;outline:none;cursor:pointer;}

/* ── TIMELINE ── */
.timeline{padding-left:24px;position:relative;}
.timeline::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:1.5px;background:var(--border2);border-radius:1px;}
.tl-block-wrap{position:relative;margin-bottom:5px;}
.tl-dot{position:absolute;left:-20px;top:13px;width:9px;height:9px;border-radius:50%;border:2px solid;background:var(--surface);z-index:2;}
.tl-gap-row{display:flex;align-items:center;gap:8px;padding:3px 0;margin:2px 0;}
.tl-gap-line{flex:1;height:1px;border-top:1px dashed var(--border);}
.tl-gap-txt{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;white-space:nowrap;}
</style>
</head>
<body>
<div class="corner tl"></div><div class="corner br"></div>
<div class="shell">
<aside class="sidebar">
  <div class="brand">
    <div class="brand-title">MI <span>RUTINA</span></div>
    <div class="brand-accent"></div>
    <div class="brand-sub" style="margin-top:7px;">Sistema Semanal</div>
  </div>
  <nav class="nav">
    <div class="nav-label">Vista</div>
    <div class="nav-item" id="nav-hoy" onclick="showToday()">
      <div class="nav-dot" style="background:var(--gold);opacity:.7"></div>Hoy
      <span id="nav-hoy-label" style="margin-left:auto;font-size:11px;color:var(--text3);font-style:italic;font-weight:300;"></span>
    </div>
    <div class="nav-item" id="nav-manana" onclick="showTomorrow()">
      <div class="nav-dot" style="background:var(--gold);opacity:.4"></div>Mañana
      <span id="nav-manana-label" style="margin-left:auto;font-size:11px;color:var(--text3);font-style:italic;font-weight:300;"></span>
    </div>
    <div class="nav-item" id="nav-week" onclick="showView('week')">
      <div class="nav-dot" style="background:var(--gold)"></div>Semana completa
    </div>
    <div class="nav-label" style="margin-top:6px;">Días</div>
    <div id="day-nav"></div>
    <div class="nav-label" style="margin-top:6px;">Configuración</div>
    <div class="nav-item" id="nav-recurrentes" onclick="showView('recurrentes')">
      <div class="nav-dot" style="background:var(--gold);opacity:.4"></div>Actividades recurrentes
    </div>
  </nav>
  <div class="nav-footer">
    <div style="display:flex;align-items:center;justify-content:flex-end;padding:4px 10px 0;">
      <span id="sync-status" style="font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;" title="Estado de sincronización"></span>
    </div>
    <div id="user-info" style="display:flex;align-items:center;gap:8px;padding:8px 10px;margin-bottom:4px;border-radius:var(--radius);">
      <img id="user-avatar" src="" style="width:28px;height:28px;border-radius:50%;display:none;border:1px solid var(--border2);">
      <span id="user-name" style="font-size:12px;color:var(--text2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
    </div>
    <button class="theme-btn" id="theme-btn" onclick="toggleTheme()">🌙<span style="font-size:12px;">Modo oscuro</span></button>
    <button class="footer-btn" onclick="importDataFirebase()">↑ Importar backup</button>
    <input type="file" id="import-input" accept=".json" style="display:none" onchange="importData(event)">
    <button class="footer-btn" onclick="resetConfirm()">↺ Restaurar defaults</button>
    <button class="footer-btn" onclick="doSignOut()" style="color:var(--red);">↪ Cerrar sesión</button>
  </div>
</aside>
<main class="main">
  <!-- Mobile day strip (only visible on mobile in day view) -->
  <div class="mob-day-strip" id="mob-day-strip" style="display:none"></div>
  <div class="page-header">
    <div><div class="page-title" id="pg-title">SEMANA</div><div class="page-sub" id="pg-sub">Vista general</div></div>
    <div class="header-right" id="pg-actions"></div>
  </div>
  <div class="page-content" id="pg-content"></div>
  <!-- Mobile tab bar -->
  <div class="mob-tabbar" id="mob-tabbar">
    <button class="mob-tab" id="mob-tab-dia" onclick="toggleHoyManana()">
      <div class="mob-tab-icon" id="mob-hoy-icon">◉</div>
      <div class="mob-tab-label" id="mob-hoy-label">Hoy</div>
    </button>
    <button class="mob-tab active" id="mob-tab-semana" onclick="mobTab('week')">
      <div class="mob-tab-icon">▦</div>
      <div class="mob-tab-label">Semana</div>
    </button>
    <button class="mob-tab" id="mob-tab-rec" onclick="mobTab('recurrentes')">
      <div class="mob-tab-icon">↺</div>
      <div class="mob-tab-label">Actividades recurrentes</div>
    </button>
    <button class="mob-tab" id="mob-tab-more" onclick="toggleMoreMenu()">
      <div class="mob-tab-icon">⋯</div>
      <div class="mob-tab-label">Más</div>
    </button>
  </div>
</main>
</div>

<!-- Mobile more menu -->
<div class="mob-more-menu" id="mob-more-menu">

  {id:'r2',title:'Bloque espiritual completo',desc:'Sin apuros · todo el tiempo',time:'09:00',timeEnd:null,cat:'espiritual',barColor:'#C4922A',days:['Sábado','Domingo']},
  {id:'r3',title:'Pre mercado',desc:'Análisis y preparación de la sesión',time:'09:30',timeEnd:'10:30',cat:'trading',barColor:'#3A8FC4',days:['Lunes','Martes','Miércoles','Jueves','Viernes']},
  {id:'r4',title:'Sesión operativa',desc:'Trading en vivo',time:'10:30',timeEnd:'12:00',cat:'trading',barColor:'#3A8FC4',days:['Lunes','Martes','Miércoles','Jueves','Viernes']},
  {id:'r5',title:'Journal de sesión',desc:'Registro inmediato post operativa',time:'12:00',timeEnd:null,cat:'trading',barColor:'#3A8FC4',days:['Lunes','Martes','Miércoles','Jueves','Viernes']},
  {id:'r6',title:'Academia',desc:'Admin · dirección · facturación según etapa del mes',time:'13:30',timeEnd:null,cat:'academia',barColor:'#5E9E6A',days:['Lunes','Martes','Miércoles','Jueves','Viernes']},
  {id:'r7',title:'Gimnasio',desc:'Entrenamiento hasta ~19:30',time:'18:00',timeEnd:'19:30',cat:'gym',barColor:'#C46A3A',days:['Lunes','Martes','Miércoles','Jueves']},
  {id:'r8',title:'Estudio — Rap',desc:'Escribir · producir · grabar',time:'21:00',timeEnd:null,cat:'rap',barColor:'#8A64B4',days:['Viernes','Sábado','Domingo']},
  {id:'r9',title:'Revisión y organización',desc:'¿Qué logré? · 3 prioridades de mañana',time:'00:30',timeEnd:null,cat:'personal',barColor:'#7A7A7A',days:['Lunes','Martes','Miércoles','Jueves','Viernes']},
];

let S={view:'day',day:(['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'][new Date().getDay()]),weekExpanded:false,blocks:{},tasks:{},nextId:2000,recurring:[]};
let dragId=null,dragDay=null,openCP=null,openTP=null;

const APP_VERSION=18;
let _currentUid=null;
let _saveTimer=null;
let _isSaving=false;
let _unsubFS=null;

function setSyncStatus(s){
  const el=document.getElementById('sync-status');
  if(!el)return;
  el.textContent=s==='syncing'?'↑':s==='synced'?'✓':s==='offline'?'⚠':'';
  el.title=s==='syncing'?'Guardando...':s==='synced'?'Guardado':s==='offline'?'Sin conexión':'';
}

async function save(){
  if(!_currentUid||!window._fb)return;
  clearTimeout(_saveTimer);
  setSyncStatus('syncing');
  _isSaving=true;
  _saveTimer=setTimeout(async()=>{
    try{
      const{db,doc,setDoc}=window._fb;
      await setDoc(doc(db,'users',_currentUid),{
        _v:APP_VERSION,
        blocks:S.blocks,tasks:S.tasks,
        timedTasks:S.timedTasks||{},
        dayCfg:S.dayCfg||{start:6,end:26},
        theme:S.theme||'dark',
        recurring:S.recurring||[],
        nextId:S.nextId
      });
      setSyncStatus('synced');
    }catch(e){
      console.error('Save error',e);
      setSyncStatus('offline');
    }finally{
      _isSaving=false;
    }
  },800);
}

async function loadForUser(uid){
  _currentUid=uid;
  if(!window._fb)return initDefault();
  try{
    const{db,doc,getDoc,onSnapshot}=window._fb;
    const ref=doc(db,'users',uid);
    // First load
    const snap=await getDoc(ref);
    if(snap.exists()){
      const p=snap.data();
      S={...S,...p};fix();applyAllRecurring();
    }else{
      initDefault();
    }
    // Then set up real-time listener (like TaskFlow)
    if(_unsubFS)_unsubFS();
    _unsubFS=onSnapshot(ref,snap=>{
      if(snap.exists()&&!_isSaving){
        const p=snap.data();
        S={...S,...p};fix();applyAllRecurring();
        renderNav();renderMain();
        // Apply theme from remote
        if(S.theme==='light'){document.body.classList.add('light');}
        else{document.body.classList.remove('light');}
        setSyncStatus('synced');
      }
    });
    setSyncStatus('synced');
  }catch(e){
    console.error('Load error',e);
    setSyncStatus('offline');
    initDefault();
  }
  renderNav();renderMain();
  initMobile();
  if(S.theme==='light'){document.body.classList.add('light');}
}

function initDefault(){
  S.blocks=clone(DEF);S.tasks=clone(DEF_TASKS);
  S.recurring=clone(DEF_REC);
  if(!S.timedTasks)S.timedTasks={};
  if(!S.dayCfg)S.dayCfg={start:6,end:26};
  applyAllRecurring();
}

function load(){initDefault();}
function fix(){
  DAYS.forEach(d=>{
    if(!S.blocks[d])S.blocks[d]=clone(DEF[d]||[]);
    if(!S.tasks[d])S.tasks[d]=[];
    if(!S.timedTasks)S.timedTasks={};
    if(!S.timedTasks[d])S.timedTasks[d]=[];
    S.blocks[d].forEach(b=>{
      if(!b.tags)b.tags=defTags(b.cat);
      if(!b.tasks)b.tasks=[];
      if(!b.barColor)b.barColor=catCol(b.cat);
      if(b.bgColor===undefined)b.bgColor=null;
      if(b.timeEnd===undefined)b.timeEnd=null;
    });
  });
  if(!S.dayCfg)S.dayCfg={start:6,end:26};
  if(!S.recurring||!S.recurring.length)S.recurring=clone(DEF_REC);
  if(S.theme==='light'){document.body.classList.add('light');const btn=document.getElementById('theme-btn');if(btn)btn.innerHTML='☀️<span style="font-size:12px;">Modo claro</span>';}
}
function clone(x){return JSON.parse(JSON.stringify(x));}
function getBlock(day,id){return(S.blocks[day]||[]).find(b=>b.id==id);}
function tv(t){if(!t||t==='tarde')return 23*60+59;const[h,m]=(t||'00:00').split(':').map(Number);return h*60+m;}
function sorted(day){return(S.blocks[day]||[]).slice().sort((a,b)=>tv(a.time)-tv(b.time));}
function h2rgba(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;}

function renderMain(){

/* ── ACTIVIDADES RECURRENTES ── */

// applyAllRecurring: recurring templates always win.
// The ONLY exception is if the user explicitly unlocked a block in a specific day
// AND manually edited it (tracked via b._localEdit flag).
// Everything else gets overwritten.
function applyAllRecurring(forceIds=[]){
  // Step 1: for each recurring template, sync all days
  (S.recurring||[]).forEach(r=>{
    DAYS.forEach(d=>{
      const inDays=r.days.includes(d)&&!r.hidden;
      const existing=(S.blocks[d]||[]).find(b=>b.recId===r.id);

      if(!inDays){
        // Remove from this day
        if(existing) S.blocks[d]=(S.blocks[d]||[]).filter(b=>b.recId!==r.id);
        return;
      }

      const isForced=forceIds.includes(r.id);

      if(existing){
        // Only preserve local edits if user explicitly edited AND didn't force
        if(existing._localEdit&&!isForced){
          // Keep local version but ensure it stays locked
          existing.locked=true;
          return;
        }
        // Overwrite with template values
        existing.time=r.time;
        existing.timeEnd=r.timeEnd||null;
        existing.title=r.title;
        existing.desc=r.desc;
        existing.barColor=r.barColor;
        existing.bgColor=r.bgColor||null;
        existing.bgOpacity=r.bgOpacity!=null?r.bgOpacity:0.08;
        existing.cat=r.cat;
        existing.locked=true;
        existing._localEdit=false;
        if(r.tags&&r.tags.length)existing.tags=clone(r.tags);
      }else{
        // Create new block from template
        if(!S.blocks[d])S.blocks[d]=[];
        const nb=mkBlock(S.nextId++,r.time,r.title,r.desc,r.cat,true,r.barColor);
        nb.timeEnd=r.timeEnd||null;
        nb.bgColor=r.bgColor||null;
        nb.bgOpacity=r.bgOpacity!=null?r.bgOpacity:0.08;
        nb.recId=r.id;
        nb._localEdit=false;
        if(r.tags&&r.tags.length)nb.tags=clone(r.tags);else nb.tags=defTags(r.cat);
        S.blocks[d].push(nb);
      }
    });
  });

  // Step 2: remove orphaned recId blocks (recurrente was deleted)
  const validIds=new Set((S.recurring||[]).map(r=>r.id));
  DAYS.forEach(d=>{
    S.blocks[d]=(S.blocks[d]||[]).filter(b=>!b.recId||validIds.has(b.recId));
  });

  // Step 3: remove duplicates (same title+time in same day)
  DAYS.forEach(d=>{
    const seen=new Map();
    S.blocks[d]=(S.blocks[d]||[]).filter(b=>{
      const key=b.time+'|'+b.title;
      if(seen.has(key)){
        // Prefer the one with recId
        if(b.recId&&!seen.get(key).recId){seen.set(key,b);return true;}
        return false;
      }
      seen.set(key,b);
      return true;
    });
  });
}

function renderRecurrentes(){
  const recs=S.recurring||[];
  if(!recs.length) return`<div class="empty" style="padding:40px 0;">No hay bloques recurrentes. Creá el primero con el botón de arriba.</div>`;
  return`<div style="display:flex;flex-direction:column;gap:10px;max-width:700px;">
    ${recs.map(r=>{
      const bar=r.barColor||catCol(r.cat);
      const timeLabel=r.timeEnd?`${r.time} → ${r.timeEnd}`:r.time;
      const isHidden=!!r.hidden;
      const dayDots=DAYS.map(d=>{
        const inDay=r.days.includes(d);
        // Check if this day has a local exception
        const block=(S.blocks[d]||[]).find(b=>b.recId===r.id);
        const hasException=block&&inDay&&(block.time!==r.time||block.title!==r.title||block.timeEnd!==(r.timeEnd||null));
        return`<div style="display:flex;flex-direction:column;align-items:center;gap:3px;">
          <div title="${hasException?'Excepción local en este día':''}" style="width:22px;height:22px;border-radius:50%;border:1px solid ${inDay?bar:'var(--border2)'};background:${inDay?bar+'22':'transparent'};display:flex;align-items:center;justify-content:center;font-size:9px;color:${inDay?bar:'var(--text3)'};position:relative;">
            ${inDay?(hasException?'≠':'✓'):''}
            ${hasException?`<div style="position:absolute;top:-2px;right:-2px;width:7px;height:7px;border-radius:50%;background:var(--gold);"></div>`:''}
          </div>
          <span style="font-size:9px;color:var(--text3);font-family:'DM Mono',monospace;">${d.slice(0,2)}</span>
        </div>`;
      }).join('');
      return`<div style="background:var(--surface);border:1px solid var(--border);border-left:3px solid ${isHidden?'var(--border2)':bar};border-radius:var(--radius-lg);padding:14px 16px;opacity:${isHidden?'.45':'1'};transition:opacity .2s;">
        <div style="display:flex;align-items:flex-start;gap:12px;">
          <div style="flex:1;min-width:0;">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
              <span style="font-family:'DM Mono',monospace;font-size:12px;color:var(--text3);">${timeLabel}</span>
              <span style="font-size:14px;font-weight:500;color:var(--text);${isHidden?'text-decoration:line-through;':''}">${r.title}</span>
              ${isHidden?`<span style="font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;padding:1px 7px;border-radius:8px;background:var(--surface3);">oculto</span>`:''}
            </div>
            ${r.desc?`<div style="font-size:12px;color:var(--text2);margin-bottom:10px;">${r.desc.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim()}</div>`:''}
            <div style="display:flex;gap:8px;align-items:center;">${dayDots}</div>
          </div>
          <div style="display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;">
            <button class="iBtn" onclick="toggleRecHidden('${r.id}')" title="${isHidden?'Mostrar en días':'Ocultar de días'}" style="${isHidden?'color:var(--gold);background:var(--gold-dim);border-color:var(--gold-border);':''}">${isHidden?'👁':'👁'}</button>
            <button class="iBtn" onclick="duplicateRec('${r.id}')" title="Duplicar">⧉</button>
            <button class="iBtn" onclick="openEditRecModal('${r.id}')" title="Editar">✎</button>
            <button class="iBtn del" onclick="delRec('${r.id}')" title="Eliminar">✕</button>
          </div>
        </div>
      </div>`;
    }).join('')}
    <div style="font-size:11px;color:var(--text3);padding:8px 4px;font-family:'DM Mono',monospace;">
      ≠ = excepción local en ese día · punto dorado = fue modificado manualmente
    </div>
  </div>`;
}

function toggleRecHidden(rid){
  const r=(S.recurring||[]).find(x=>x.id===rid);if(!r)return;
  r.hidden=!r.hidden;
  applyAllRecurring();
  save();renderMain();
}

function duplicateRec(rid){
  const r=(S.recurring||[]).find(x=>x.id===rid);if(!r)return;
  const copy={...clone(r),id:'r'+Date.now(),title:r.title+' (copia)',days:[]};
  S.recurring.push(copy);
  save();renderMain();

  openEditRecModal(copy.id);
}

function confirmRec(rid,force=false){
  const title=document.getElementById('rm-title')?.value.trim();if(!title){alert('Escribí el nombre.');return;}
  const desc=(document.getElementById('rm-desc')?.innerHTML||'').trim();
  const time=document.getElementById('rm-time')?.value||'08:00';
  const timeEnd=document.getElementById('rm-timeend')?.value||null;
  const cat=document.getElementById('rm-cat')?.value||'personal';
  const barColor=document.getElementById('rm-color')?.value||catCol(cat);
  const bgColor=document.getElementById('rm-bgcolor')?.value||null;
  const bgOpacity=parseFloat(document.getElementById('rm-bgopacity')?.value||'0.08');
  const days=DAYS.filter(d=>document.getElementById('rm-day-'+d)?.checked);
  const tags=clone(_rmTags);
  if(!days.length){alert('Seleccioná al menos un día.');return;}
  if(!S.recurring)S.recurring=[];
  let finalId=rid;
  if(rid){
    const idx=S.recurring.findIndex(x=>x.id===rid);
    if(idx>=0)S.recurring[idx]={...S.recurring[idx],title,desc,time,timeEnd,cat,barColor,bgColor,bgOpacity,days,tags};
  }else{
    finalId='r'+Date.now();
    S.recurring.push({id:finalId,title,desc,time,timeEnd,cat,barColor,bgColor,bgOpacity,days,tags,hidden:false});
  }
  applyAllRecurring(force?[finalId]:[]);
  save();closeModal();renderNav();renderMain();
}
function delRec(rid){
  if(!confirm('¿Eliminar este bloque recurrente? Se quitará de todos los días donde estaba aplicado.'))return;
  S.recurring=(S.recurring||[]).filter(x=>x.id!==rid);
  DAYS.forEach(d=>{S.blocks[d]=(S.blocks[d]||[]).filter(b=>b.recId!==rid);});
  save();renderNav();renderMain();
}

/* DAY */
let openGaps={};
let dragTT=null;

function toggleGap(gid){
  openGaps[gid]=!openGaps[gid];
  const el=document.getElementById('gap-'+gid);
  if(el)el.classList.toggle('open',!!openGaps[gid]);
  const btn=document.getElementById('gbtn-'+gid);
  if(btn)btn.querySelector('.gap-plus').textContent=openGaps[gid]?'−':'+';
}

function renderTimedTask(day,t){
  return`<div class="timed-task-row" id="tt-${day}-${t.id}"
    draggable="true"
    ondragstart="onTTDragStart(event,'${day}',${t.id})"
    ondragend="onTTDragEnd(event)">
    <span class="btime editable" style="flex-shrink:0;min-width:42px;cursor:pointer;"
      onclick="event.stopPropagation();editTTTime('${day}',${t.id})"
      id="ttt-${day}-${t.id}">${t.time}</span>
    <div style="display:flex;align-items:center;gap:7px;flex:1;">
      <div class="btask-check${t.done?' done':''}"
        onclick="event.stopPropagation();toggleTimedTask('${day}',${t.id})"
        style="width:15px;height:15px;border-radius:50%;border:1px solid rgba(255,255,255,0.2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:9px;color:transparent;flex-shrink:0;transition:all .12s;">✓</div>
      <span style="font-size:13px;color:${t.done?'var(--text3)':'var(--text2)'};${t.done?'text-decoration:line-through;':''}">${t.text}</span>
      <button onclick="event.stopPropagation();delTimedTask('${day}',${t.id})"
        style="background:none;border:none;cursor:pointer;color:var(--text3);font-size:12px;margin-left:auto;opacity:0;transition:opacity .1s;" class="tt-del">✕</button>
    </div>
  </div>`;
}

function buildGap(day,gid,fromH,toH,allTT){
  const slots=[];
  let h=fromH;
  for(let guard=0;guard<24;guard++){
    const hStr=String(h%24).padStart(2,'0')+':00';
    slots.push(hStr);
    h++;
    if(h%24===toH%24)break;
  }
  if(!slots.length)return'';
  const slotHtml=slots.map(hs=>`
    <div class="gap-hour-slot" id="gslot-${day}-${hs.replace(':','')}"
      onclick="openAddModal('${day}','${hs}')"
      ondragover="onGDO(event,'${day}','${hs}')"
      ondragleave="onGDL('${day}','${hs}')"
      ondrop="onGDD(event,'${day}','${hs}')">
      <div class="gap-hour-time">${hs}</div>
      <div class="gap-hour-hint">+ agregar bloque · soltar tarea aquí</div>
    </div>`).join('');
  return`<div class="gap-btn" id="gbtn-${gid}" onclick="toggleGap('${gid}')"
    ondragover="onGapBtnDragOver(event,'${gid}')"
    ondragleave="onGapBtnDragLeave(event,'${gid}')">
      <div class="gap-line"></div><div class="gap-plus">+</div><div class="gap-line"></div>
    </div>
    <div class="gap-hours" id="gap-${gid}"
      ondragleave="onGapBtnDragLeave(event,'${gid}')">${slotHtml}</div>`;
}

function renderDay(day){
  const blocks=sorted(day),tasks=S.tasks[day]||[];
  const allTT=((S.timedTasks||{})[day]||[]);
  const cfg=S.dayCfg||{start:6,end:26};
  const startMin=cfg.start*60;

  // Group timed tasks by hour
  const ttByHour={};
  allTT.forEach(t=>{
    const h=t.time.slice(0,2)+':00';
    if(!ttByHour[h])ttByHour[h]=[];
    ttByHour[h].push(t);
  });

  // Build flat sorted list: blocks + hour-groups of timed tasks
  const items=[];
  blocks.forEach(b=>items.push({type:'block',tvMin:tv(b.time),tvEnd:b.timeEnd?tv(b.timeEnd):tv(b.time)+30,b}));
  Object.entries(ttByHour).forEach(([h,tts])=>{
    items.push({type:'tts',tvMin:tv(h),tvEnd:tv(h)+15,hour:h,tts});
  });
  items.sort((a,b)=>a.tvMin-b.tvMin);

  function normTv(t){let v=t;if(v<startMin)v+=24*60;return v;}
  items.forEach(it=>{it.norm=normTv(it.tvMin);it.normEnd=normTv(it.tvEnd);});
  items.sort((a,b)=>a.norm-b.norm);

  let tl='';
  const endMin=cfg.end*60;

  if(!items.length){
    tl=buildGap(day,'all-'+day,cfg.start,cfg.end%24,allTT);
    if(!tl)tl=`<div class="empty">Sin bloques. Usá el botón de arriba para agregar.</div>`;
  }else{
    items.forEach((item,i)=>{
      if(i===0){
        const firstNorm=item.norm;
        if(firstNorm-startMin>60){
          tl+=buildGap(day,'pre-'+day,cfg.start,Math.floor(item.tvMin/60),allTT);
        }
      }
      if(i>0){
        const prevEndNorm=items[i-1].normEnd;
        const curNorm=item.norm;
        if(curNorm-prevEndNorm>45){
          const fromH=Math.ceil(prevEndNorm/60)%24;
          const toH=Math.floor(item.tvMin/60)%24;
          if(fromH!==toH)tl+=buildGap(day,'mid-'+day+'-'+i,fromH,toH,allTT);
        }
      }
      if(item.type==='block') tl+=renderBlock(day,item.b);
      else{
        tl+=`<div class="tt-hour-group" ondragover="onGDO(event,'${day}','${item.hour}')" ondragleave="onGDL('${day}','${item.hour}')" ondrop="onGDD(event,'${day}','${item.hour}')" style="display:flex;flex-direction:column;gap:3px;">`;
        item.tts.forEach(t=>{tl+=renderTimedTask(day,t);});
        tl+=`</div>`;
      }
      if(i===items.length-1){
        const lastEndNorm=item.normEnd;
        const normEnd=cfg.end<=cfg.start?cfg.end*60+24*60:cfg.end*60;
        if(normEnd-lastEndNorm>45){
          const fromH=Math.ceil(lastEndNorm/60)%24;
          const toH=cfg.end%24;
          tl+=buildGap(day,'post-'+day,fromH,toH,allTT);
        }
      }
    });
  }

  const tasksHtml=tasks.length?tasks.map(t=>`
    <div class="task-item" id="tsk-${day}-${t.id}" draggable="true"
      ondragstart="onTDS(event,'${day}',${t.id})" ondragend="onTDE()">
      <span class="grab">⠿</span>
      <div class="tchk${t.done?' done':''}" onclick="toggleTask('${day}',${t.id})">✓</div>
      <div class="tlbl${t.done?' done':''}">${t.text}</div>
      <button class="task-del" onclick="delTask('${day}',${t.id})">✕</button>
    </div>`).join(''):`<div class="empty">Sin tareas.</div>`;

  return`<div class="day-layout">
    <div><div class="panel">
      <div class="panel-hd">
        <div class="panel-title">Bloques del día</div>
        <button class="btn btn-sm" onclick="openDayCfg()" title="Configurar rango del día" style="padding:3px 8px;font-size:11px;">⚙ ${String(cfg.start).padStart(2,'0')}:00 – ${String(cfg.end%24).padStart(2,'0')}:00</button>
      </div>
      <div class="panel-body"><div class="timeline">${tl}</div></div>
    </div></div>
    <div><div class="panel"><div class="panel-hd"><div class="panel-title">Tareas y pendientes</div></div><div class="panel-body">
      <div class="drag-hint">⠿ Arrastrá a un bloque o a una hora libre del día</div>
      ${tasksHtml}
      <div style="margin-top:10px;">
        <input class="form-input" style="width:100%;margin-bottom:7px;" id="ti-${day}" type="text"
          placeholder="Nueva tarea o pendiente..." onkeydown="if(event.key==='Enter')addTask('${day}')">
        <button class="btn btn-primary" style="width:100%;" onclick="addTask('${day}')">+ Agregar tarea</button>
      </div>
    </div></div></div>
  </div>`;
}

/* GAP DROP */
function onGapBtnDragOver(e,gid){
  if(dragId===null&&dragTT===null)return;
  e.preventDefault();e.stopPropagation();
  if(!openGaps[gid]){
    openGaps[gid]=true;
    const el=document.getElementById('gap-'+gid);
    if(el)el.classList.add('open');
    const btn=document.getElementById('gbtn-'+gid);
    if(btn)btn.querySelector('.gap-plus').textContent='−';
  }
}
function onGapBtnDragLeave(e,gid){
  if(dragId===null&&dragTT===null)return;
  const rel=e.relatedTarget;
  const gapEl=document.getElementById('gap-'+gid);
  const btnEl=document.getElementById('gbtn-'+gid);
  // Don't collapse if moving to children of gap or button
  if(rel&&(gapEl?.contains(rel)||btnEl?.contains(rel)||gapEl===rel||btnEl===rel))return;
  // Don't collapse if moving to a gap-hour-slot (the drop targets)
  if(rel&&rel.closest&&rel.closest('.gap-hours'))return;
  // Collapse
  openGaps[gid]=false;
  if(gapEl)gapEl.classList.remove('open');
  if(btnEl)btnEl.querySelector('.gap-plus').textContent='+';
}
function onGDO(e,day,hs){
  if(dragId===null&&dragTT===null)return;
  e.preventDefault();e.stopPropagation();
  document.getElementById('gslot-'+day+'-'+hs.replace(':',''))?.classList.add('drag-target');
}
function onGDL(day,hs){
  document.getElementById('gslot-'+day+'-'+hs.replace(':',''))?.classList.remove('drag-target');
}
function onGDD(e,day,hs){
  e.preventDefault();e.stopPropagation();
  document.querySelectorAll('.gap-hour-slot,.timed-task-row').forEach(el=>el.classList.remove('drag-target'));
  if(!S.timedTasks)S.timedTasks={};
  if(!S.timedTasks[day])S.timedTasks[day]=[];
  if(dragId!==null&&dragDay!==null){
    const task=(S.tasks[dragDay]||[]).find(t=>t.id===dragId);if(!task)return;
    S.timedTasks[day].push({id:S.nextId++,text:task.text,time:hs,done:false});
    S.tasks[dragDay]=(S.tasks[dragDay]||[]).filter(t=>t.id!==dragId);
    save();renderNav();renderMain();return;
  }
  if(dragTT!==null){
    const{day:fromDay,id}=dragTT;
    const tt=((S.timedTasks||{})[fromDay]||[]).find(t=>t.id===id);
    if(!tt)return;
    if(fromDay!==day){
      if(!S.timedTasks[day])S.timedTasks[day]=[];
      S.timedTasks[day].push({id:S.nextId++,text:tt.text,time:hs,done:false});
      S.timedTasks[fromDay]=S.timedTasks[fromDay].filter(t=>t.id!==id);
    }else{
      tt.time=hs;
    }
    save();renderMain();
  }
}

/* TIMED TASK DRAG */
function onTTDragStart(e,day,id){
  dragTT={day,id};dragId=null;dragDay=null;
  e.dataTransfer.effectAllowed='move';
  setTimeout(()=>document.getElementById('tt-'+day+'-'+id)?.classList.add('dragging'),0);
}
function onTTDragEnd(e){
  dragTT=null;
  document.querySelectorAll('.timed-task-row.dragging').forEach(el=>el.classList.remove('dragging'));
  document.querySelectorAll('.drag-target').forEach(el=>el.classList.remove('drag-target'));
}

function renderBlock(day,b){
  const bar=b.barColor||catCol(b.cat);
  const bg=b.bgColor?h2rgba(b.bgColor,b.bgOpacity!=null?b.bgOpacity:0.09):'var(--surface2)';
  const ed=!b.locked;
  const tagsHtml=`<div class="block-tags-wrap" id="tags-${day}-${b.id}">`+(b.tags||[]).map(t=>{const lbl=t.label||t.name||'tag';return`<span class="tag" data-tid="${t.id}" style="background:${h2rgba(t.color,0.15)};color:${t.color};border-color:${h2rgba(t.color,0.3)};">
    ${ed?'<span class="tag-drag" style="cursor:grab;opacity:.35;font-size:9px;margin-right:2px;">⠿</span>':''}
    <span class="tag-name${ed?' editable':''}" ${ed?`onclick="openTagEditor('${day}',${b.id},${t.id})"`:''}>${lbl}</span>
    ${ed?`<button class="tag-del-btn" style="color:${t.color}" onclick="delTag('${day}',${b.id},${t.id})">✕</button>`:''}
  </span>`}).join('')+'</div>';
  const btasks=(b.tasks||[]).length?`<div class="block-tasks">${(b.tasks||[]).map(t=>`<div class="btask-row"><div class="btask-check${t.done?' done':''}" onclick="toggleBTask('${day}',${b.id},${t.id})">✓</div><span class="btask-lbl${t.done?' done':''}">${t.text}</span><button class="btask-del" onclick="delBTask('${day}',${b.id},${t.id})">✕</button></div>`).join('')}</div>`:'';
  return`<div class="tl-block-wrap">
    <div class="tl-dot" style="border-color:${bar};background:${h2rgba(bar,0.15)};"></div>
    <div class="block-item${ed?' editable-block':''}" id="bi-${day}-${b.id}" style="background:${bg};border-left-color:${bar};"
      ondragover="onBDO(event,'${day}',${b.id})" ondragleave="onBDL('${day}',${b.id})" ondrop="onBDD(event,'${day}',${b.id})">
      <div class="block-time-col">
        ${ed
          ? `<div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap;">
              <span class="btime editable" onclick="editTime('${day}',${b.id})" id="bt-${day}-${b.id}">${b.time}</span>
              ${b.timeEnd
                ? `<span class="btime-arrow">→</span>
                   <span class="btime editable" onclick="editTimeEnd('${day}',${b.id})" id="bte-${day}-${b.id}">${b.timeEnd}</span>
                   <button onclick="clearTimeEnd('${day}',${b.id})" style="background:none;border:none;cursor:pointer;color:var(--text3);font-size:10px;padding:0 1px;" title="Quitar hora fin">✕</button>`
                : `<button onclick="editTimeEnd('${day}',${b.id})" style="background:none;border:none;cursor:pointer;color:var(--text3);font-size:10px;padding:0 2px;opacity:.5;transition:opacity .1s;" title="Agregar hora fin" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=.5">+fin</button>`}
             </div>`
          : `<div style="display:flex;align-items:center;gap:3px;white-space:nowrap;">
              <span class="btime">${b.time}</span>
              ${b.timeEnd?`<span class="btime-arrow">→</span><span class="btime">${b.timeEnd}</span>`:''}
             </div>`}
      </div>
      <div class="block-body">
        ${ed?`<span class="bname editable" onclick="editName('${day}',${b.id})" id="bn-${day}-${b.id}">${b.title}</span>`:`<span class="bname">${b.title}</span>`}
        ${ed?`<div class="bdesc editable" id="bd-${day}-${b.id}" onclick="editDesc('${day}',${b.id},this)">${b.desc||`<span style='color:var(--text3);font-style:italic'>Sin descripción · click para editar</span>`}</div>`:`<div class="bdesc">${b.desc||''}</div>`}
        <div class="bmeta">
          ${tagsHtml}
          ${ed?`<div style="position:relative;"><button class="tag-add-btn" onclick="openAddTag('${day}',${b.id})">+ tag</button><div class="tag-popup" id="tp-${day}-${b.id}"></div></div>`:''}

        </div>
        ${btasks}
      </div>
      <div class="block-actions">
        <div style="position:relative;">
          <button class="iBtn" onclick="toggleCP('${day}',${b.id},this)" title="Colores" style="font-size:10px;letter-spacing:-1px;">●●</button>
          <div class="cp-popup" id="cp-${day}-${b.id}">${renderCP(day,b)}</div>
        </div>
        <button class="iBtn${b.locked?' lock-on':''}" onclick="toggleLock('${day}',${b.id})">${b.locked?'🔒':'🔓'}</button>
        ${!b.locked?`<button class="iBtn del" onclick="delBlock('${day}',${b.id})">✕</button>`:''}
      </div>
    </div>
  </div>`;
}

function renderCP(day,b){
  const bar=b.barColor||catCol(b.cat),bg=b.bgColor||'#1C1C1C';
  const swatches=(selected,fn)=>PAL.map(c=>`<div class="sw${selected===c?' sel':''}" style="background:${c}" onclick="${fn}('${day}',${b.id},'${c}')"></div>`).join('');
  return`<div class="cp-lbl">Barra lateral</div>
    <div class="cp-swatches">${swatches(bar,'setBar')}</div>
    <div class="cp-row"><div class="cp-prev" id="bp-${day}-${b.id}" style="background:${bar}"></div><input class="cp-hex" value="${bar}" maxlength="7" oninput="onBarHex('${day}',${b.id},this.value)"></div>
    <div class="cp-div"></div>
    <div class="cp-lbl">Fondo del bloque</div>
    <div class="cp-swatches">${swatches(bg,'setBg')}</div>
    <div class="cp-row"><div class="cp-prev" id="bgp-${day}-${b.id}" style="background:${bg}"></div><input class="cp-hex" value="${bg}" maxlength="7" oninput="onBgHex('${day}',${b.id},this.value)"><button class="btn btn-sm" style="font-size:10px;padding:2px 6px;" onclick="clearBg('${day}',${b.id})">✕</button></div>`;
}

/* INLINE EDIT */
function editName(day,id){
  const b=getBlock(day,id);if(!b||b.locked)return;
  const el=document.getElementById('bn-'+day+'-'+id);if(!el)return;
  el.outerHTML=`<input class="bname-input" id="bn-${day}-${id}" value="${b.title}" onblur="saveName('${day}',${id},this)" onkeydown="if(event.key==='Enter')this.blur()">`;
  const i=document.getElementById('bn-'+day+'-'+id);if(i){i.focus();i.select();}
}
function saveName(day,id,inp){
  const b=getBlock(day,id);if(!b)return;
  const newTitle=inp.value.trim()||b.title;
  b.title=newTitle;
  if(b.recId){
    b._localEdit=true;
    const r=(S.recurring||[]).find(x=>x.id===b.recId);
    if(r&&confirm(`¿Aplicar el nombre "${newTitle}" a todos los días con este bloque?`)){
      r.title=newTitle;applyAllRecurring([b.recId]);
    }
  }
  save();renderMain();
}
function editTime(day,id){
  const b=getBlock(day,id);if(!b||b.locked)return;
  const el=document.getElementById('bt-'+day+'-'+id);if(!el)return;
  el.outerHTML=`<input class="btime-input" id="bt-${day}-${id}" type="time" value="${b.time}" onblur="saveTime('${day}',${id},this)" onkeydown="if(event.key==='Enter')this.blur()">`;
  const i=document.getElementById('bt-'+day+'-'+id);if(i)i.focus();
}
function saveTime(day,id,inp){const b=getBlock(day,id);if(b){b.time=inp.value||b.time;if(b.recId)b._localEdit=true;save();renderMain();}}
function editTimeEnd(day,id){
  const b=getBlock(day,id);if(!b||b.locked)return;
  const cur=b.timeEnd||'';
  const el=document.getElementById('bte-'+day+'-'+id);
  const html=`<input class="btime-input" id="bte-${day}-${id}" type="time" value="${cur}" onblur="saveTimeEnd('${day}',${id},this)" onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape'){this.value='';this.blur();}">`;
  if(el){el.outerHTML=html;}else{
    // No end time yet — inject after start time span
    const st=document.getElementById('bt-'+day+'-'+id);
    if(st){st.insertAdjacentHTML('afterend',`<span style="color:var(--text3);font-size:11px;">→</span>${html}`);}
  }
  document.getElementById('bte-'+day+'-'+id)?.focus();
}
function saveTimeEnd(day,id,inp){
  const b=getBlock(day,id);if(!b)return;
  b.timeEnd=inp.value||null;
  save();renderMain();
}
function clearTimeEnd(day,id){const b=getBlock(day,id);if(b){b.timeEnd=null;save();renderMain();}}
function saveDesc(day,id,el){const b=getBlock(day,id);if(b&&!b.locked){b.desc=el.innerText.trim();save();}}
function editDesc(day,id,el){
  openRTE(day,id);
}

/* COLORS */
function setBar(day,id,c){const b=getBlock(day,id);if(b){b.barColor=c;save();renderMain();}}
function setBg(day,id,c){const b=getBlock(day,id);if(b){b.bgColor=c;save();renderMain();}}
function clearBg(day,id){const b=getBlock(day,id);if(b){b.bgColor=null;save();renderMain();}}
function onBarHex(day,id,v){if(/^#[0-9A-Fa-f]{6}$/.test(v)){const b=getBlock(day,id);if(b){b.barColor=v;save();}const p=document.getElementById('bp-'+day+'-'+id);if(p)p.style.background=v;}}
function onBgHex(day,id,v){if(/^#[0-9A-Fa-f]{6}$/.test(v)){const b=getBlock(day,id);if(b){b.bgColor=v;save();}const p=document.getElementById('bgp-'+day+'-'+id);if(p)p.style.background=v;}}
function toggleCP(day,id){
  const pop=document.getElementById('cp-'+day+'-'+id);if(!pop)return;
  if(openCP&&openCP!==pop)openCP.classList.remove('open');
  pop.classList.toggle('open');
  if(pop.classList.contains('open')){
    // Detect if near bottom of viewport — open upward
    const rect=pop.getBoundingClientRect();
    const spaceBelow=window.innerHeight-rect.top;
    pop.classList.toggle('upward',spaceBelow<320);
    openCP=pop;
  }else{
    openCP=null;
  }
}

/* TAGS */
function openAddTag(day,bid){
  const pop=document.getElementById('tp-'+day+'-'+bid);if(!pop)return;
  if(openTP&&openTP!==pop)openTP.classList.remove('open');
  const c=PAL[Math.floor(Math.random()*PAL.length)];
  pop.dataset.color=c;
  pop.innerHTML=buildTagPopup(day,bid,null,'',c,'confirmAddTag');
  pop.classList.add('open');openTP=pop;
  setTimeout(()=>{pop.querySelector('.tag-text-inp')?.focus();},30);
}
function openTagEditor(day,bid,tid){
  const b=getBlock(day,bid);if(!b)return;
  const tag=(b.tags||[]).find(t=>t.id===tid);if(!tag)return;
  const pop=document.getElementById('tp-'+day+'-'+bid);if(!pop)return;
  if(openTP&&openTP!==pop)openTP.classList.remove('open');
  pop.dataset.color=tag.color;pop.dataset.tid=tid;
  pop.innerHTML=buildTagPopup(day,bid,tid,tag.label,tag.color,'confirmEditTag');
  pop.classList.add('open');openTP=pop;
  setTimeout(()=>{const inp=pop.querySelector('.tag-text-inp');if(inp){inp.focus();inp.select();}},30);
}
function buildTagPopup(day,bid,tid,label,color,confirmFn){
  const ks=tid?`'${day}',${bid},${tid}`:`'${day}',${bid}`;
  return`<div class="cp-lbl">${tid?'Editar':'Nuevo'} tag</div>
    <div class="tag-input-row">
      <input class="tag-text-inp" type="text" value="${label}" placeholder="Nombre..." onkeydown="if(event.key==='Enter')${confirmFn}(${ks})">
      <div class="tag-csw" id="tcsw-${day}-${bid}" style="background:${color}"></div>
    </div>
    <div class="mini-pal">${PAL.map(c=>`<div class="msw${c===color?' sel':''}" style="background:${c}" onclick="selTagCol(this,document.getElementById('tp-${day}-${bid}'),'tcsw-${day}-${bid}','${c}')"></div>`).join('')}</div>
    <div class="tag-popup-btns">
      <button class="btn btn-sm" style="flex:1" onclick="closePopups()">Cancelar</button>
      <button class="btn btn-primary btn-sm" style="flex:1" onclick="${confirmFn}(${ks})">Guardar</button>
    </div>`;
}
function selTagCol(el,pop,swId,color){
  pop.dataset.color=color;
  pop.querySelectorAll('.msw').forEach(s=>s.classList.toggle('sel',s===el));
  const sw=document.getElementById(swId);if(sw)sw.style.background=color;
}
function confirmAddTag(day,bid){
  const pop=document.getElementById('tp-'+day+'-'+bid);if(!pop)return;
  const label=pop.querySelector('.tag-text-inp')?.value.trim();if(!label)return;
  const color=pop.dataset.color||PAL[0];
  const b=getBlock(day,bid);if(!b)return;
  if(!b.tags)b.tags=[];
  b.tags.push(mkTag(label,color));
  save();closePopups();renderMain();
}
function confirmEditTag(day,bid,tid){
  const pop=document.getElementById('tp-'+day+'-'+bid);if(!pop)return;
  const label=pop.querySelector('.tag-text-inp')?.value.trim();if(!label)return;
  const color=pop.dataset.color;
  const b=getBlock(day,bid);if(!b)return;
  const tag=(b.tags||[]).find(t=>t.id==tid);if(tag){tag.label=label;tag.color=color;}
  save();closePopups();renderMain();
}
function delTag(day,bid,tid){const b=getBlock(day,bid);if(b){b.tags=(b.tags||[]).filter(t=>t.id!=tid);save();renderMain();}}

/* DRAG & DROP */
function onTDS(e,day,id){dragId=id;dragDay=day;dragTT=null;e.dataTransfer.effectAllowed='move';setTimeout(()=>{document.getElementById('tsk-'+day+'-'+id)?.classList.add('dragging');},0);}
function onTDE(){dragId=null;dragDay=null;dragTT=null;document.querySelectorAll('.task-item,.timed-task-row').forEach(e=>e.classList.remove('dragging'));document.querySelectorAll('.block-item,.gap-hour-slot,.timed-task-row').forEach(e=>e.classList.remove('drag-target'));}
function onBDO(e,day,bid){if(dragId===null)return;e.preventDefault();document.getElementById('bi-'+day+'-'+bid)?.classList.add('drag-target');}
function onBDL(day,bid){document.getElementById('bi-'+day+'-'+bid)?.classList.remove('drag-target');}
function onBDD(e,day,bid){
  e.preventDefault();document.querySelectorAll('.block-item').forEach(el=>el.classList.remove('drag-target'));
  if(dragId===null||dragDay===null)return;
  const task=(S.tasks[dragDay]||[]).find(t=>t.id===dragId);if(!task)return;
  const block=getBlock(day,bid);if(!block)return;
  if(!block.tasks)block.tasks=[];
  if(block.tasks.find(t=>t.text===task.text))return;
  block.tasks.push({id:S.nextId++,text:task.text,done:false});
  S.tasks[dragDay]=(S.tasks[dragDay]||[]).filter(t=>t.id!==dragId);
  save();renderNav();renderMain();
}


function toggleBTask(day,bid,tid){const b=getBlock(day,bid);if(!b)return;const t=(b.tasks||[]).find(t=>t.id===tid);if(t){t.done=!t.done;save();renderMain();}}
function delBTask(day,bid,tid){const b=getBlock(day,bid);if(!b)return;b.tasks=(b.tasks||[]).filter(t=>t.id!==tid);save();renderMain();}

/* TASKS */
function addTask(day){
  const inp=document.getElementById('ti-'+day);if(!inp)return;
  const text=inp.value.trim();if(!text)return;
  if(!S.tasks[day])S.tasks[day]=[];
  S.tasks[day].push({id:S.nextId++,text,done:false});
  save();renderNav();renderMain();
}
function toggleTask(day,id){const t=(S.tasks[day]||[]).find(t=>t.id===id);if(t){t.done=!t.done;save();renderNav();renderMain();}}
function delTask(day,id){S.tasks[day]=(S.tasks[day]||[]).filter(t=>t.id!==id);save();renderNav();renderMain();}

/* BLOCK ACTIONS */
function toggleLock(day,id){
  const b=getBlock(day,id);if(!b)return;
  b.locked=!b.locked;
  save();renderMain();
}
function delBlock(day,id){if(!confirm('¿Eliminar este bloque?'))return;S.blocks[day]=(S.blocks[day]||[]).filter(b=>b.id!=id);save();renderNav();renderMain();}

    <div class="fgrp"><div class="flbl">Descripción (opcional)</div><input class="form-input" type="text" id="m-desc" placeholder="Detalle..."></div>
    <div class="fgrp"><div class="flbl">Categoría</div><select class="form-input" id="m-cat" onchange="updMC()">${['espiritual','trading','academia','rap','gym','personal'].map(k=>`<option value="${k}">${k}</option>`).join('')}</select></div>
    <div class="fgrp"><div class="flbl">Color barra</div>

    </div>

  document.getElementById('modal-ft').innerHTML=`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="confirmAdd('${day}')">Agregar</button>`;
  document.getElementById('modal-ov').style.display='flex';
  setTimeout(()=>{document.getElementById('m-title')?.focus();},50);

function updMC(){const cat=document.getElementById('m-cat')?.value;if(cat){const c=catCol(cat);const inp=document.getElementById('m-color');if(inp)inp.value=c;document.querySelectorAll('#modal-body .sw').forEach(s=>s.classList.toggle('sel',s.style.background===c));}}
function selMC(el,c){document.querySelectorAll('#modal-body .sw').forEach(s=>s.classList.remove('sel'));el.classList.add('sel');const inp=document.getElementById('m-color');if(inp)inp.value=c;}
function confirmAdd(day){
  const time=document.getElementById('m-time')?.value;
  const timeEnd=document.getElementById('m-timeend')?.value||null;
  const title=document.getElementById('m-title')?.value.trim();
  const desc=document.getElementById('m-desc')?.value.trim();
  const cat=document.getElementById('m-cat')?.value;
  const color=document.getElementById('m-color')?.value||catCol(cat);
  const locked=document.getElementById('m-lock')?.value==='1';
  if(!title){alert('Escribí el nombre del bloque.');return;}
  if(!S.blocks[day])S.blocks[day]=[];
  const nb=mkBlock(S.nextId++,time,title,desc,cat,locked,color);
  nb.timeEnd=timeEnd;
  S.blocks[day].push(nb);save();closeModal();renderNav();renderMain();
}
function closeModal(){document.getElementById('modal-ov').style.display='none';}
function closeModalOv(e){if(e.target===document.getElementById('modal-ov'))closeModal();}

function toggleTimedTask(day,id){

}
function delTimedTask(day,id){

}
function editTTTime(day,id){

/* THEME */
function toggleTheme(){
  const isLight=document.body.classList.toggle('light');
  S.theme=isLight?'light':'dark';
  save();
  const btn=document.getElementById('theme-btn');
  if(btn)btn.innerHTML=isLight?'☀️<span style="font-size:12px;">Modo claro</span>':'🌙<span style="font-size:12px;">Modo oscuro</span>';
}

function importData(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const p=JSON.parse(ev.target.result);
      // Accept any version on import — user chose to import it
      S={...S,...p,_v:APP_VERSION};
      fix();
      applyAllRecurring();
      save();
      renderNav();
      renderMain();
      alert('✓ Datos importados correctamente.');
    }catch(err){
      alert('Error al importar: el archivo no es válido.');
    }
    // Reset input so same file can be imported again if needed
    e.target.value='';
  };
  reader.readAsText(file);
}


/* ── RICH TEXT EDITOR ── */

        <div class="rte-sep"></div>
        ${RTE_COLORS_EXT.map(c=>`<div class="rte-color-btn" id="rtec-${c.slice(1)}" style="background:${c}" onmousedown="event.preventDefault();rteColor('${c}')" title="${c}"></div>`).join('')}
        <div class="rte-sep"></div>
        <button class="rte-btn" onmousedown="event.preventDefault();rteCmd('removeFormat')" title="Limpiar" style="font-size:11px;">✕fmt</button>
      </div>
      <div class="rte-area" id="rte-content" contenteditable="true" data-placeholder="Escribí la descripción..." onkeyup="rteUpdateState()" onmouseup="rteUpdateState()">${b.desc||''}</div>
    </div>
  `;
  document.getElementById('modal-ft').innerHTML=`
    <button class="btn" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-primary" onclick="saveRTE()">Guardar</button>
  `;
  document.getElementById('modal-ov').style.display='flex';
  setTimeout(()=>{
    const el=document.getElementById('rte-content');
    if(el){el.focus();// place cursor at end
      const r=document.createRange();r.selectNodeContents(el);r.collapse(false);
      const s=window.getSelection();s.removeAllRanges();s.addRange(r);
    }
  },80);
}

function rteCmd(cmd){
  const el=document.getElementById('rte-content');
  if(!el)return;
  el.focus();
  document.execCommand(cmd,false,null);
  rteUpdateState();
}

function rteFontSize(size){
  const el=document.getElementById('rte-content');
  if(!el)return;
  el.focus();
  document.execCommand('fontSize',false,size);
}

function rteColor(color){
  const el=document.getElementById('rte-content');
  if(!el)return;
  el.focus();
  // Save selection, apply color
  const sel=window.getSelection();
  if(!sel||sel.rangeCount===0)return;
  document.execCommand('styleWithCSS',false,true);
  document.execCommand('foreColor',false,color);
  document.execCommand('styleWithCSS',false,false);
  // Update active color indicator
  document.querySelectorAll('.rte-color-btn').forEach(b=>b.classList.remove('rte-color-active'));
  document.getElementById('rtec-'+color.slice(1))?.classList.add('rte-color-active');
}

function rteUpdateState(){
  ['bold','italic','underline'].forEach(cmd=>{
    const active=document.queryCommandState(cmd);
    document.getElementById('rte-'+cmd)?.classList.toggle('rte-active',active);
  });
}

function saveRTE(){
  const day=_rteDay,id=_rteId;
  const b=getBlock(day,id);if(!b)return;
  const el=document.getElementById('rte-content');
  if(!el)return;
  const newDesc=el.innerHTML;
  const oldDesc=b.desc;
  b.desc=newDesc;
  // Ask about propagation if it's a recurring block
  if(b.recId){
    const r=(S.recurring||[]).find(x=>x.id===b.recId);
    if(r){
      closeModal();
      setTimeout(()=>{
        if(confirm(`¿Aplicar este cambio de descripción a todos los días donde existe "${b.title}"?`)){
          r.desc=newDesc;
          applyAllRecurring([b.recId]);
        }
        save();renderMain();
      },100);
      return;
    }
  }
  save();closeModal();renderMain();
}


/* ── HOY/MAÑANA TOGGLE ── */
let _showingManana=false;
function toggleHoyManana(){
  const iconEl=document.getElementById('mob-hoy-icon');
  const labelEl=document.getElementById('mob-hoy-label');
  if(S.view==='day'&&S.day===getTodayName()&&!_showingManana){
    // Currently on HOY → switch to MAÑANA
    _showingManana=true;
    showTomorrow();
    if(iconEl)iconEl.textContent='◎';
    if(labelEl)labelEl.textContent='Mañana';
  }else if(S.view==='day'&&S.day===getTomorrowName()&&_showingManana){
    // Currently on MAÑANA → switch back to HOY
    _showingManana=false;
    showToday();
    if(iconEl)iconEl.textContent='◉';
    if(labelEl)labelEl.textContent='Hoy';
  }else{
    // Not on day view yet → go to HOY
    _showingManana=false;
    showToday();
    if(iconEl)iconEl.textContent='◉';
    if(labelEl)labelEl.textContent='Hoy';
  }
  mobTab('day');
}

function initTagSortables(){
  if(typeof Sortable==='undefined')return;
  document.querySelectorAll('.block-tags-wrap').forEach(el=>{
    if(el._sortable){el._sortable.destroy();el._sortable=null;}
    const parts=el.id.split('-');// tags-Day-id
    const day=parts[1],bid=parseInt(parts[2]);
    if(el._sortable)el._sortable.destroy();
    el._sortable=Sortable.create(el,{
      animation:150,
      ghostClass:'tag-ghost',
      handle:'.tag-drag',
      onEnd:function(evt){
        const b=getBlock(day,bid);if(!b)return;
        const newOrder=[...el.querySelectorAll('.tag')].map(t=>parseInt(t.dataset.tid));
        b.tags=newOrder.map(tid=>b.tags.find(t=>t.id===tid)).filter(Boolean);
        save();
      }
    });
  });
}

/* ── FIREBASE AUTH ── */
function doSignIn(){
  if(!window._fb){alert('Cargando, intentá de nuevo.');return;}
  const{auth,provider,signInWithPopup,signInWithRedirect}=window._fb;
  const mobile=window.innerWidth<=900||window.matchMedia('(display-mode:standalone)').matches||(window.navigator.standalone===true);
  if(mobile){
    signInWithRedirect(auth,provider).catch(e=>console.error('Redirect error:',e));
  }else{
    signInWithPopup(auth,provider).catch(e=>{
      console.error('Popup error:',e.code);
      if(e.code==='auth/popup-blocked'){
        // Fallback to redirect
        signInWithRedirect(auth,provider).catch(e2=>console.error(e2));
      }
    });
  }
}
function doSignOut(){
  if(!window._fb)return;
  const{auth,signOut}=window._fb;
  signOut(auth).then(()=>{
    _currentUid=null;
    document.getElementById('login-screen').classList.remove('hidden');
    document.getElementById('login-loading').style.display='none';
  });
}
function importDataFirebase(){
  document.getElementById('import-input').click();
}
async function importData(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=async ev=>{
    try{
      const p=JSON.parse(ev.target.result);
      S={...S,...p};
      fix();applyAllRecurring();
      await save();
      renderNav();renderMain();
      alert('✓ Datos importados y guardados en la nube.');
    }catch(err){alert('Error al importar: archivo no válido.');}
    e.target.value='';
  };
  reader.readAsText(file);
}
function updateUserUI(user){
  const name=user.displayName||user.email||'';
  const photo=user.photoURL||'';
  const nameEl=document.getElementById('user-name');
  const avatarEl=document.getElementById('user-avatar');
  const mobNameEl=document.getElementById('mob-user-name');
  const mobAvatarEl=document.getElementById('mob-user-avatar');
  if(nameEl)nameEl.textContent=name;
  if(avatarEl&&photo){avatarEl.src=photo;avatarEl.style.display='block';}
  if(mobNameEl)mobNameEl.textContent=name;
  if(mobAvatarEl&&photo){mobAvatarEl.src=photo;mobAvatarEl.style.display='block';}
}

// Wait for Firebase to load then init auth
function startApp(){
  if(!window._fb){setTimeout(startApp,100);return;}
  const{auth,onAuthStateChanged,getRedirectResult}=window._fb;
  // Handle redirect result (mobile login)
  getRedirectResult(auth).then(r=>{
    // onAuthStateChanged handles the rest
  }).catch(e=>console.error('Redirect result error:',e));
  // Auth state listener
  onAuthStateChanged(auth,user=>{
    if(user){
      document.getElementById('login-screen').style.display='none';
      updateUserUI(user);
      if(!window._appLoaded){
        window._appLoaded=true;
        loadForUser(user.uid);
        updateHoyManana();
      }
    }else{
      window._appLoaded=false;
      document.getElementById('login-screen').style.display='flex';
    }
  });
}
