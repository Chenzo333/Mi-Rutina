<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --white: #ffffff;
  --black: #0a0a0a;
  --gray-50:  #fafafa;
  --gray-100: #f2f2f2;
  --gray-200: #e4e4e4;
  --gray-300: #cacaca;
  --gray-400: #a0a0a0;
  --gray-500: #6e6e6e;
  --blue: #2563a8;
  --blue-light: rgba(37,99,168,0.06);
  --green: #1a7a4a;
  --font: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --radius: 4px;
  --col: 560px;
}

body {
  font-family: var(--font);
  background: var(--white);
  color: var(--black);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── NAV ── */
.nav {
  position: sticky; top: 0; z-index: 50;
  background: var(--white);
  border-bottom: 1px solid var(--gray-200);
  display: flex; align-items: center;
  padding: 0 48px; height: 52px;
}
.nav-logo {
  font-size: 10px; font-weight: 700; letter-spacing: 2.5px;
  text-transform: uppercase; color: var(--black);
  margin-right: 48px; white-space: nowrap;
}
.nav-logo span { color: var(--blue); }
.nav-tabs { display: flex; gap: 0; }
.nav-tab {
  padding: 0 20px; height: 52px;
  display: flex; align-items: center;
  font-size: 12px; font-weight: 500; letter-spacing: 0.4px;
  color: var(--gray-400); cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color .15s, border-color .15s;
  background: none; border-top: none; border-left: none; border-right: none;
  font-family: var(--font);
}
.nav-tab:hover { color: var(--black); }
.nav-tab.active { color: var(--black); border-bottom-color: var(--blue); }

/* ── PÁGINAS ── */
.page { display: none; }
.page.active { display: block; }

/* ── COLUMNA CENTRAL ── */
.container {
  max-width: var(--col);
  margin: 0 auto;
  padding: 64px 0 100px;
}

/* ── HEADER DÍA ── */
.day-header { margin-bottom: 52px; }
.day-eyebrow {
  font-size: 9px; font-weight: 700; letter-spacing: 3px;
  text-transform: uppercase; color: var(--blue);
  margin-bottom: 12px;
}
.day-title {
  font-size: 30px; letter-spacing: -0.8px; line-height: 1.1;
  color: var(--black);
}
.day-title strong { font-weight: 700; }
.day-title .light { font-weight: 300; color: var(--gray-400); }

.day-meta {
  margin-top: 24px;
  display: flex; align-items: center; gap: 14px;
}
.day-progress-wrap {
  width: 160px; height: 2px;
  background: var(--gray-200); border-radius: 2px; overflow: hidden;
}
.day-progress-bar {
  height: 100%; background: var(--blue); border-radius: 2px;
  transition: width .5s ease;
}
.day-score-label {
  font-size: 12px; font-weight: 700; color: var(--blue);
  min-width: 34px; font-variant-numeric: tabular-nums;
}
.day-score-tasks {
  font-size: 11px; color: var(--gray-400); letter-spacing: 0.1px;
}

/* ── BLOQUE HORARIO ── */
.blocks-card {
  border: 1px solid var(--gray-200);
  border-radius: 8px;
  overflow: hidden;
  margin-bottom: 0;
}
.block { margin-bottom: 0; }
.block + .block { border-top: 1px solid var(--gray-100); }
.block-inner { padding: 0 24px; }
.block-label {
  font-size: 8px; font-weight: 700; letter-spacing: 4px;
  text-transform: uppercase; color: var(--blue);
  padding: 16px 24px 14px;
  border-bottom: 1px solid var(--gray-100);
  margin-bottom: 0;
  display: flex; align-items: center; gap: 8px;
  background: var(--gray-50);
}
.block-label::before {
  content: '';
  width: 3px; height: 3px; border-radius: 50%;
  background: var(--blue); flex-shrink: 0;
}

/* ── ITEM ── */
.item {
  display: grid;
  grid-template-columns: 48px 12px 1fr 24px;
  align-items: center;
  gap: 0 16px;
  padding: 13px 24px;
  border-bottom: 1px solid var(--gray-100);
  transition: background .12s;
  cursor: pointer;
}
.item:last-child { border-bottom: none; }
.item:hover { background: var(--blue-light); }
.item.done { opacity: 0.38; }
.item.done .item-name { text-decoration: line-through; text-decoration-color: var(--gray-300); }

.item-time {
  font-size: 11px; font-weight: 600;
  color: var(--blue); letter-spacing: 0.3px;
  text-align: right; font-variant-numeric: tabular-nums;
}
.item-time.no-time {
  color: var(--gray-300); font-size: 14px; font-weight: 300; text-align: right;
}

.item-dot {
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--gray-300); justify-self: center;
}
.item.done .item-dot { background: var(--blue); }

.item-name {
  font-size: 14px; font-weight: 400;
  color: var(--black); letter-spacing: -0.1px;
}

/* ── CHECKBOX ── */
.item-check {
  width: 18px; height: 18px; border-radius: 50%;
  border: 1.5px solid var(--gray-200);
  background: transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s; flex-shrink: 0; justify-self: end;
}
.item-check:hover { border-color: var(--blue); }
.item-check.checked { background: var(--blue); border-color: var(--blue); }
.item-check.checked::after {
  content: '';
  width: 4px; height: 8px;
  border-right: 1.5px solid white;
  border-bottom: 1.5px solid white;
  transform: rotate(45deg) translate(-1px, -1px);
  display: block;
}

/* ── SEMANA ── */
.week-header { margin-bottom: 48px; }
.week-header h2 {
  font-size: 22px; font-weight: 700; letter-spacing: -0.5px;
}
.week-header .sub { font-size: 12px; color: var(--gray-400); margin-top: 5px; }

.week-big-score {
  display: flex; align-items: baseline; gap: 8px;
  margin-bottom: 48px; padding-bottom: 40px;
  border-bottom: 1px solid var(--gray-100);
}
.week-big-score .num {
  font-size: 72px; font-weight: 700; letter-spacing: -4px;
  color: var(--black); line-height: 1;
  font-variant-numeric: tabular-nums;
}
.week-big-score .unit { font-size: 22px; font-weight: 300; color: var(--gray-300); }
.week-big-score .label {
  font-size: 10px; font-weight: 700; color: var(--gray-400);
  text-transform: uppercase; letter-spacing: 2px;
  margin-left: 4px; align-self: center;
}

.days-grid { display: flex; flex-direction: column; gap: 0; }
.day-row {
  display: grid; grid-template-columns: 90px 1fr 42px;
  align-items: center; gap: 20px;
  padding: 16px 0; border-bottom: 1px solid var(--gray-100);
}
.day-row:last-child { border-bottom: none; }
.day-row .dname {
  font-size: 11px; font-weight: 700; letter-spacing: 0.8px;
  color: var(--gray-400); text-transform: uppercase;
}
.day-row .dname.today { color: var(--blue); }
.day-bar-wrap { height: 2px; background: var(--gray-100); border-radius: 2px; overflow: hidden; }
.day-bar { height: 100%; border-radius: 2px; background: var(--blue); transition: width .5s; }
.day-pct {
  font-size: 12px; font-weight: 700; color: var(--black);
  text-align: right; font-variant-numeric: tabular-nums;
}
.day-pct.zero { color: var(--gray-300); font-weight: 400; }

/* ── HISTORIAL ── */
.hist-header { margin-bottom: 48px; }
.hist-header h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
.hist-header .sub { font-size: 12px; color: var(--gray-400); margin-top: 5px; }

.hist-section-title {
  font-size: 8px; font-weight: 700; letter-spacing: 3.5px;
  text-transform: uppercase; color: var(--gray-300);
  margin-bottom: 8px; margin-top: 44px;
  padding-bottom: 10px; border-bottom: 1px solid var(--gray-100);
  display: flex; align-items: center; gap: 12px;
}
.hist-section-title:first-of-type { margin-top: 0; }
.hist-avg {
  font-size: 11px; font-weight: 700; color: var(--blue);
  letter-spacing: 0; text-transform: none;
}

.hist-row {
  display: grid; grid-template-columns: 1fr 100px 48px;
  align-items: center; gap: 20px;
  padding: 14px 0; border-bottom: 1px solid var(--gray-100);
}
.hist-row:last-child { border-bottom: none; }
.hist-label { font-size: 13px; color: var(--black); font-weight: 400; }
.hist-bar-wrap { height: 2px; background: var(--gray-100); border-radius: 2px; overflow: hidden; }
.hist-bar { height: 100%; border-radius: 2px; background: var(--blue); }
.hist-pct {
  font-size: 13px; font-weight: 700; color: var(--black);
  text-align: right; font-variant-numeric: tabular-nums;
}
.hist-pct.perfect { color: var(--green); }
.hist-empty {
  font-size: 13px; color: var(--gray-300); padding: 48px 0;
  text-align: center; font-style: italic; line-height: 1.6;
}

/* ── RESET BTN ── */
.reset-btn {
  margin-top: 52px; padding: 9px 18px;
  border: 1px solid var(--gray-200); border-radius: var(--radius);
  background: transparent; color: var(--gray-400);
  font-family: var(--font); font-size: 11px; font-weight: 600;
  letter-spacing: 0.5px; text-transform: uppercase;
  cursor: pointer; transition: all .15s;
}
.reset-btn:hover { border-color: var(--gray-400); color: var(--black); }

/* ── FOOTER ── */
.footer {
  max-width: var(--col);
  margin: 0 auto; padding: 0 0 48px;
  display: flex; align-items: center; gap: 16px;
}
.footer-brand {
  font-size: 9px; font-weight: 700; letter-spacing: 2.5px;
  text-transform: uppercase; color: var(--gray-300); white-space: nowrap;
}
.footer-line { flex: 1; height: 1px; background: var(--gray-100); }
</style>

<script>
// ══════════════════════════════════════════════════
// DATOS
// ══════════════════════════════════════════════════
const DIAS = ['Lunes','Martes','Miércoles','Jueves','Viernes'];
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

// Tareas base (lunes a jueves)
const TAREAS_BASE = [
  { bloque: 'Mañana', hora: '08:00', nombre: 'Despertar' },
  { bloque: 'Mañana', hora: '08:15', nombre: 'Taller creativo' },
  { bloque: 'Mañana', hora: '09:20', nombre: 'Lectura' },
  { bloque: 'Mercado', hora: '10:00', nombre: 'Pre-mercado' },
  { bloque: 'Mercado', hora: '10:30', nombre: 'Sesión operativa' },
  { bloque: 'Mercado', hora: '12:00', nombre: 'Journal de trading' },
  { bloque: 'Mediodía', hora: '13:00', nombre: 'Almuerzo' },
  { bloque: 'Mediodía', hora: '15:00', nombre: 'Luz MYC' },
  { bloque: 'Tarde', hora: '18:00', nombre: 'Gimnasio' },
  { bloque: 'Tarde', hora: '19:30', nombre: 'Estudiar trading' },
  { bloque: 'Noche', hora: '22:30', nombre: 'Cena' },
  { bloque: 'Noche', hora: '', nombre: 'Organizar día' },
  { bloque: 'Noche', hora: '12:30', nombre: 'Lectura' },
  { bloque: 'Noche', hora: '01:00', nombre: 'Taller creativo' },
];

// Viernes: sin Gimnasio
const TAREAS_VIERNES = TAREAS_BASE.filter(t => t.nombre !== 'Gimnasio');

function tareasParaDia(diaSemana) {
  // diaSemana: 0=Lunes...4=Viernes
  return diaSemana === 4 ? TAREAS_VIERNES : TAREAS_BASE;
}

// ══════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════
function getWeekKey(date) {
  const d = new Date(date);
  // Lunes de esa semana
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1 - day);
  d.setDate(d.getDate() + diff);
  return `${d.getFullYear()}-W${String(getWeekNumber(d)).padStart(2,'0')}`;
}

function getWeekNumber(d) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1));
  return Math.ceil((((date - yearStart) / 86400000) + 1)/7);
}

function getDayKey(date) {
  const d = new Date(date);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function getMonthKey(date) {
  const d = new Date(date);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

function loadState() {
  const s = localStorage.getItem('nexo_agenda');
  if (s) { try { return JSON.parse(s); } catch(e) {} }
  return { weeks: {}, history: [] };
}

function saveState() {
  localStorage.setItem('nexo_agenda', JSON.stringify(state));
}

let state = loadState();

// ── Obtener/inicializar semana actual ──
function getCurrentWeekData() {
  const wk = getWeekKey(new Date());
  if (!state.weeks[wk]) {
    state.weeks[wk] = {};
    // Inicializar los 5 días
    for (let d = 0; d < 5; d++) {
      const tareas = tareasParaDia(d);
      state.weeks[wk][d] = tareas.map((t, i) => ({ ...t, id: i, done: false }));
    }
    saveState();
  }
  return state.weeks[wk];
}

// ── Detectar si hay que resetear (domingo a la noche pasó) ──
function checkReset() {
  const now = new Date();
  const wk = getWeekKey(now);
  if (!state.weeks[wk]) {
    archivePreviousWeek();
  }
}

function archivePreviousWeek() {
  const keys = Object.keys(state.weeks).sort();
  if (keys.length === 0) return;
  const currentWk = getWeekKey(new Date());
  // Solo archivar semanas que NO son la actual
  const toArchive = keys.filter(k => k !== currentWk);
  toArchive.forEach(lastKey => {
    const weekData = state.weeks[lastKey];
    const score = calcWeekScore(weekData);
    if (!state.history) state.history = [];
    // Solo archivar si la semana ya terminó (hay al menos una semana más nueva)
    // Esto evita archivar la semana de instalación
    if (keys.length > 1 || state.history.length > 0) {
      state.history.push({ weekKey: lastKey, score, date: new Date().toISOString() });
    }
    delete state.weeks[lastKey];
  });
  saveState();
}

function calcWeekScore(weekData) {
  let total = 0, done = 0;
  for (let d = 0; d < 5; d++) {
    if (weekData[d]) {
      total += weekData[d].length;
      done += weekData[d].filter(t => t.done).length;
    }
  }
  return total > 0 ? Math.round((done / total) * 100) : 0;
}

function calcDayScore(dayData) {
  if (!dayData || dayData.length === 0) return { pct: 0, done: 0, total: 0 };
  const done = dayData.filter(t => t.done).length;
  return { pct: Math.round((done / dayData.length) * 100), done, total: dayData.length };
}

// ══════════════════════════════════════════════════
// RENDER HOY
// ══════════════════════════════════════════════════
function getTodayDayIndex() {
  const day = new Date().getDay(); // 0=Dom, 1=Lun...
  if (day === 0 || day === 6) return null; // fin de semana
  return day - 1; // 0=Lun...4=Vie
}

function renderHoy() {
  const now = new Date();
  const dayIdx = getTodayDayIndex();

  // Título
  const diasNombres = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  document.getElementById('todayName').textContent = diasNombres[now.getDay()];
  const mesNombre = MESES[now.getMonth()];
  document.getElementById('todayDate').textContent = ` ${now.getDate()} de ${mesNombre} · ${now.getFullYear()}`;

  const container = document.getElementById('todayBlocks');

  if (dayIdx === null) {
    container.innerHTML = `<div style="color:var(--gray-400);font-size:14px;padding:40px 0">Es fin de semana. La agenda vuelve el lunes.</div>`;
    document.getElementById('dayProgressBar').style.width = '0%';
    document.getElementById('dayScoreLabel').textContent = '—';
    document.getElementById('dayScoreTasks').textContent = '';
    return;
  }

  const weekData = getCurrentWeekData();
  const dayData = weekData[dayIdx];
  const { pct, done, total } = calcDayScore(dayData);

  // Progress header
  document.getElementById('dayProgressBar').style.width = pct + '%';
  document.getElementById('dayScoreLabel').textContent = pct + '%';
  document.getElementById('dayScoreTasks').textContent = `${done} de ${total} tareas`;

  // Agrupar por bloque
  const bloques = {};
  dayData.forEach(t => {
    if (!bloques[t.bloque]) bloques[t.bloque] = [];
    bloques[t.bloque].push(t);
  });

  container.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'blocks-card';
  for (const [bloque, items] of Object.entries(bloques)) {
    const blockEl = document.createElement('div');
    blockEl.className = 'block';
    blockEl.innerHTML = `<div class="block-label">${bloque}</div>`;
    items.forEach(task => {
      const row = document.createElement('div');
      row.className = 'item' + (task.done ? ' done' : '');
      row.innerHTML = `
        <div class="item-time ${task.hora ? '' : 'no-time'}">${task.hora || '—'}</div>
        <div class="item-dot"></div>
        <div class="item-name">${task.nombre}</div>
        <div class="item-check ${task.done ? 'checked' : ''}" onclick="toggleTask(${dayIdx},${task.id},this)"></div>
      `;
      row.onclick = (e) => {
        if (!e.target.classList.contains('item-check')) {
          const chk = row.querySelector('.item-check');
          toggleTask(dayIdx, task.id, chk);
        }
      };
      blockEl.appendChild(row);
    });
    card.appendChild(blockEl);
  }
  container.appendChild(card);
}

function toggleTask(dayIdx, taskId, chkEl) {
  const weekData = getCurrentWeekData();
  const task = weekData[dayIdx].find(t => t.id === taskId);
  if (!task) return;
  task.done = !task.done;
  saveState();
  renderHoy();
}

// ══════════════════════════════════════════════════
// RENDER SEMANA
// ══════════════════════════════════════════════════
function renderSemana() {
  const now = new Date();
  const weekData = getCurrentWeekData();

  // Rango de fechas de la semana
  const lunes = new Date(now);
  const day = now.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  lunes.setDate(now.getDate() + diff);
  const viernes = new Date(lunes); viernes.setDate(lunes.getDate() + 4);
  document.getElementById('weekRange').textContent =
    `${lunes.getDate()} de ${MESES[lunes.getMonth()]} — ${viernes.getDate()} de ${MESES[viernes.getMonth()]}`;

  // Score global
  const weekScore = calcWeekScore(weekData);
  document.getElementById('weekScoreNum').textContent = weekScore;

  // Días
  const grid = document.getElementById('daysGrid');
  grid.innerHTML = '';
  const todayIdx = getTodayDayIndex();
  for (let d = 0; d < 5; d++) {
    const { pct, done, total } = calcDayScore(weekData[d]);
    const isToday = d === todayIdx;
    const row = document.createElement('div');
    row.className = 'day-row';
    row.innerHTML = `
      <div class="dname ${isToday ? 'today' : ''}">${DIAS[d]}${isToday ? ' ·' : ''}</div>
      <div class="day-bar-wrap"><div class="day-bar" style="width:${pct}%"></div></div>
      <div class="day-pct ${pct === 0 ? 'zero' : ''}">${pct > 0 ? pct + '%' : '—'}</div>
    `;
    grid.appendChild(row);
  }
}

function confirmReset() {
  if (!confirm('¿Resetear la semana actual? Los datos se guardarán en el historial.')) return;
  const wk = getWeekKey(new Date());
  const weekData = state.weeks[wk];
  if (weekData) {
    const score = calcWeekScore(weekData);
    if (!state.history) state.history = [];
    state.history.push({ weekKey: wk, score, date: new Date().toISOString(), manual: true });
    delete state.weeks[wk];
    saveState();
  }
  renderSemana();
  renderHoy();
  alert('Semana reseteada. Podés ver el score en Historial.');
}

// ══════════════════════════════════════════════════
// RENDER HISTORIAL
// ══════════════════════════════════════════════════
function renderHistorial() {
  const container = document.getElementById('historialContent');
  const history = state.history || [];

  if (history.length === 0) {
    container.innerHTML = `<div class="hist-empty">Todavía no hay semanas archivadas.<br>El historial aparece cuando se completa una semana.</div>`;
    return;
  }

  // Agrupar por mes
  const porMes = {};
  history.forEach(entry => {
    // Extraer año y semana del weekKey (YYYY-Www)
    const [year, ww] = entry.weekKey.split('-W');
    // Aproximar mes por fecha guardada
    const d = new Date(entry.date);
    const mk = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    if (!porMes[mk]) porMes[mk] = [];
    porMes[mk].push(entry);
  });

  let html = '';
  const mesKeys = Object.keys(porMes).sort().reverse();

  for (const mk of mesKeys) {
    const [yr, mo] = mk.split('-');
    const mesNombre = MESES[parseInt(mo) - 1] + ' ' + yr;
    const entries = porMes[mk].sort((a,b) => b.weekKey.localeCompare(a.weekKey));
    const avgMes = Math.round(entries.reduce((s,e) => s + e.score, 0) / entries.length);

    html += `<div class="hist-section-title">${mesNombre} <span style="font-weight:400;color:var(--blue);margin-left:8px">${avgMes}% promedio</span></div>`;

    entries.forEach(entry => {
      const wNum = entry.weekKey.split('-W')[1];
      const d = new Date(entry.date);
      const label = `Semana ${parseInt(wNum)}`;
      const pct = entry.score;
      html += `
        <div class="hist-row">
          <div class="hist-label">${label}${entry.manual ? ' <span style="font-size:10px;color:var(--gray-400)">(manual)</span>' : ''}</div>
          <div class="hist-bar-wrap"><div class="hist-bar" style="width:${pct}%"></div></div>
          <div class="hist-pct ${pct === 100 ? 'perfect' : ''}">${pct}%</div>
        </div>`;
    });
  }

  container.innerHTML = html;
}

// ══════════════════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════════════════
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelector(`.nav-tab[onclick="showPage('${name}')"]`).classList.add('active');
  if (name === 'semana') renderSemana();
  if (name === 'historial') renderHistorial();
}
